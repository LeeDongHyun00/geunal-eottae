# XcodeGen spec for the iOS app (docs/parts/ios.md §2-3). `make project-ios` turns it into GeunalApp.xcodeproj, which
# git ignores: a project file edited by hand drifts from the directory layout, while this spec and the layout are the
# whole truth. The pinned XcodeGen comes from scripts/tool.sh.
name: GeunalApp

options:
  minimumXcodeGenVersion: 2.46.0
  xcodeVersion: "26.6"
  projectFormat: xcode16_3
  # Korean is the base language; English is a later step (docs/parts/ios.md §7).
  developmentLanguage: ko
  bundleIdPrefix: app.geunal
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

packages:
  GeunalCore:
    path: Packages/GeunalCore
  CoreBridge:
    path: Packages/CoreBridge
  DesignSystem:
    path: Packages/DesignSystem
  FeatureAccount:
    path: Packages/FeatureAccount
  FeatureCalendar:
    path: Packages/FeatureCalendar
  HomeWidget:
    path: Packages/HomeWidget

targets:
  GeunalApp:
    type: application
    platform: iOS
    sources:
      - path: GeunalApp
    dependencies:
      - package: GeunalCore
      - package: CoreBridge
      - package: DesignSystem
      - package: FeatureAccount
      - package: FeatureCalendar
      - package: HomeWidget
      # Embedded in PlugIns; the widget reads the snapshot the app writes to the App Group.
      - target: GeunalWidget
    # Account-bound values (Kakao app key, team ID) come from Config/Secrets.xcconfig, which git ignores.
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geunal.ios
        # iPhone only, like the 390x844 boards in docs/design. It sits on the target because XcodeGen's iOS preset sets
        # 1,2 at target level, which beats the project level; an iPad bundle must allow every orientation and split
        # view, so App Store Connect refused the portrait-only build (90474).
        TARGETED_DEVICE_FAMILY: "1"
        # Keys the build settings cannot express (the Kakao URL scheme, custom keys, usage descriptions); merged with
        # the generated Info.plist.
        INFOPLIST_FILE: GeunalApp/Info.plist
        # Keychain Sharing (docs/parts/ios.md §8): the notification extension reads the same keys from M3, and the
        # simulator keychain works only for an app signed with entitlements. Sign in with Apple needs its own
        # entitlement. Automatic signing adds both capabilities to the App ID once a team is set.
        CODE_SIGN_ENTITLEMENTS: GeunalApp/GeunalApp.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        INFOPLIST_KEY_CFBundleDisplayName: 그날어때
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - GeunalAppTests
        - GeunalAppUITests
      # Korean UI strings are what the UI test looks for.
      language: ko
      region: KR

  # The home screen widgets (docs/parts/ios.md §2, m1.md screen 14). They read the snapshot the app writes to the App
  # Group container and never open the core; the views live in the HomeWidget package, which the app's tests share.
  GeunalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GeunalWidget
    dependencies:
      - package: HomeWidget
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geunal.ios.widget
        INFOPLIST_FILE: GeunalWidget/Info.plist
        # App Groups, for the snapshot; signing adds the capability to the widget's App ID once a team is set.
        CODE_SIGN_ENTITLEMENTS: GeunalWidget/GeunalWidget.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        INFOPLIST_KEY_CFBundleDisplayName: 그날어때
        SKIP_INSTALL: YES

  GeunalAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GeunalAppTests
    dependencies:
      - target: GeunalApp
      - package: GeunalCore
      - package: CoreBridge
      - package: DesignSystem
      - package: FeatureAccount
      - package: FeatureCalendar
      - package: HomeWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geunal.ios.tests

  GeunalAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GeunalAppUITests
    dependencies:
      - target: GeunalApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.geunal.ios.uitests

# Versions are pinned here and resolved versions in the lockfiles. Moving a line below is its own PR (CLAUDE.md).
[versions]
# AGP 9.3 needs Gradle 9.5+ and SDK Build Tools 36.0.0, and the AndroidX releases below compile against API 37. Kotlin 2.4.21 fully supports Gradle up to 9.7.0 (the wrapper's
# version) and AGP up to 9.3.x, so AGP stays on 9.3 until Kotlin's table moves.
agp = "9.3.3"
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
# The revision scripts/tool.sh android-ndk pins (r28c). AGP strips the core's libraries with its llvm-strip.
ndk = "28.2.13676358"
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

compose-bom = "2026.09.00"
androidx-activity = "1.13.0"
androidx-annotation = "1.11.0"
# 1.1.0 is the last stable release; the prompt asks for a biometric or the screen lock (m1.md §4 "기기 인증").
androidx-biometric = "1.1.0"
androidx-browser = "1.10.0"
androidx-core = "1.19.1"
# BiometricPrompt runs in a FragmentActivity.
androidx-fragment = "1.9.1"
androidx-lifecycle = "2.11.0"
androidx-navigation3 = "1.2.0"
androidx-test-core = "1.7.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-services = "1.6.0"
coroutines = "1.11.0"
# UniFFI's generated Kotlin loads the core through JNA (docs/parts/android.md §1).
jna = "5.19.1"
junit = "4.13.2"
# Kakao Login (docs/parts/android.md §1). Published only to Kakao's repository (settings.gradle.kts).
kakao-sdk = "2.26.0"
kotlinx-serialization = "1.12.0"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "androidx-lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "androidx-navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidx-biometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidx-fragment" }
kakao-user = { module = "com.kakao.sdk:v2-user", version.ref = "kakao-sdk" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
# Lets instrumented tests write screenshots that AGP copies off the device (connected_android_test_additional_output).
androidx-test-services = { module = "androidx.test.services:test-services", version.ref = "androidx-test-services" }
androidx-test-storage = { module = "androidx.test.services:storage", version.ref = "androidx-test-services" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

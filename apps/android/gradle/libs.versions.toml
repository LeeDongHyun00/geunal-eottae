# Versions are pinned here and resolved versions in the lockfiles. Moving a line below is its own PR (CLAUDE.md).
[versions]
# AGP 9.3 needs Gradle 9.5+ and SDK Build Tools 36.0.0, and the AndroidX releases below compile against API 37. Kotlin 2.4.21 fully supports Gradle up to 9.7.0 (the wrapper's
# version) and AGP up to 9.3.x, so AGP stays on 9.3 until Kotlin's table moves.
agp = "9.3.3"
kotlin = "2.4.21"
ktlint-gradle = "14.2.0"
# The revision scripts/tool.sh android-ndk pins (r28c). AGP strips the core's libraries with its llvm-strip.
ndk = "28.2.13676358"
compileSdk = "37"
minSdk = "26"
targetSdk = "36"

compose-bom = "2026.09.00"
androidx-activity = "1.13.0"
androidx-annotation = "1.11.0"
androidx-core = "1.19.1"
androidx-lifecycle = "2.11.0"
androidx-test-junit = "1.3.0"
androidx-test-runner = "1.7.0"
coroutines = "1.11.0"
# UniFFI's generated Kotlin loads the core through JNA (docs/parts/android.md §1).
jna = "5.19.1"
junit = "4.13.2"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "androidx-annotation" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui = { module = "androidx.compose.ui:ui" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }

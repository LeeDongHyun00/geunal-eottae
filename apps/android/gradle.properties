org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

# scripts/tool.sh android-sdk installs the pinned platform, build-tools and NDK. A missing package must fail the build
# instead of making AGP download whatever revision is newest.
android.builder.sdkDownload=false
kotlin.code.style=official

[package]
name = "geunal-ffi"
description = "UniFFI facade for the apps: the Core object, decrypt_push, listener and secret-store callbacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# lib for Rust callers such as the end-to-end client, cdylib for Android and for uniffi-bindgen to read, staticlib for
# the iOS XCFramework.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
chrono.workspace = true
geunal-crypto.workspace = true
geunal-domain.workspace = true
geunal-mls.workspace = true
geunal-store.workspace = true
geunal-sync.workspace = true
rand_core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
unicode-segmentation.workspace = true
uniffi.workspace = true
uuid.workspace = true

[features]
# The in-process fake server of geunal-sync with the M1 account rules, for this crate's tests. The apps' libraries are
# built without it.
fake-server = []

[dev-dependencies]
# Turns the fake server on for the tests only.
geunal-ffi = { workspace = true, features = ["fake-server"] }
geunal-mls.workspace = true
pollster.workspace = true
tempfile.workspace = true

[lints]
workspace = true

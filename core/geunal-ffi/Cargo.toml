[package]
name = "geunal-ffi"
description = "UniFFI facade for the apps: the Core object, decrypt_push, listener and secret-store callbacks"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
# lib for Rust callers such as the end-to-end client, cdylib for Android and for uniffi-bindgen to read, staticlib for
# the iOS XCFramework.
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
geunal-domain.workspace = true
geunal-mls.workspace = true
geunal-store.workspace = true
geunal-sync.workspace = true
rand_core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
uniffi.workspace = true
uuid.workspace = true

[dev-dependencies]
geunal-mls.workspace = true
pollster.workspace = true
tempfile.workspace = true

[lints]
workspace = true

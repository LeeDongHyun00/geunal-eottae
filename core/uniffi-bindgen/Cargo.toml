[package]
name = "uniffi-bindgen"
description = "Generates the Swift and Kotlin bindings with the same uniffi release geunal-ffi is built with"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
uniffi = { workspace = true, features = ["cli"] }

[lints]
workspace = true

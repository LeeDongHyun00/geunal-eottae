[workspace]
resolver = "3"
members = [
  "geunal-crypto",
  "geunal-domain",
  "geunal-store",
  "geunal-mls",
  "geunal-sync",
  "geunal-ffi",
  "geunal-e2e",
  "uniffi-bindgen",
]
# Plain `cargo test` covers the product crates. Tool crates build only when a script needs them, and the end-to-end
# tests only under `make e2e`, which starts the stack they talk to.
default-members = ["geunal-crypto", "geunal-domain", "geunal-store", "geunal-mls", "geunal-sync", "geunal-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

# Versions are the ones kickoff appendix B verified together; bump them in their own PR, never inside a feature PR.
# mls-rs-provider-sqlite 0.23 needs rusqlite 0.37, and there may be only one libsqlite3-sys in the build, so rusqlite
# stays on 0.37. mls-rs-crypto-rustcrypto builds on chacha20poly1305 0.10 and rand_core 0.6; newer RustCrypto releases
# would put a second copy of the AEAD stack into every app (docs/parts/rust-core.md §2, §7 size budget).
[workspace.dependencies]
geunal-crypto = { path = "geunal-crypto" }
geunal-domain = { path = "geunal-domain" }
geunal-store = { path = "geunal-store" }
geunal-mls = { path = "geunal-mls" }
geunal-sync = { path = "geunal-sync" }
geunal-ffi = { path = "geunal-ffi" }

argon2 = "0.5"
base64 = "0.23"
chacha20poly1305 = { version = "0.10", features = ["stream"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
ciborium = "0.2"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
mls-rs = "0.56"
mls-rs-crypto-rustcrypto = "0.22"
mls-rs-provider-sqlite = "0.23"
pollster = "0.4"
proptest = "1"
rand_core = { version = "0.6", features = ["getrandom"] }
# No default features: the default TLS backend is aws-lc-rs with the OS trust store, which needs cmake on Android and a
# JNI handshake before the first request. The core installs its own rustls config instead (docs/adr/0002).
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rusqlite = "0.37"
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "net"] }
# `__rustls-tls` alone: the roots features would pull a second webpki-roots release, and the connector takes the same
# rustls config the HTTP client uses.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "__rustls-tls"] }
uniffi = "0.31"
uuid = { version = "1", features = ["v7", "v4"] }
webpki-roots = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Panics must unwind: UniFFI turns a panic at the FFI boundary into an error instead of killing the app.
# Symbols stay in the library because uniffi-bindgen reads its metadata from them; app packaging strips them.
[profile.release]
lto = true
codegen-units = 1

# SQLite's C code sits outside LTO, so its own optimization level decides its size: -Oz takes about 0.75 MB off each
# Android library (rust-core.md §7). The Rust code stays at opt-level 3 because Argon2id at 64 MiB runs about 50%
# slower at "z", and LTO would undo a per-crate level for Rust anyway. The vendored OpenSSL ignores this setting.
[profile.release.package.libsqlite3-sys]
opt-level = "z"

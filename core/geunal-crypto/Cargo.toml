[package]
name = "geunal-crypto"
description = "Encryption outside MLS: state blob AEAD, STREAM chunks for media and backups, the recovery code and the account master key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
chacha20poly1305.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
hkdf.workspace = true
rand_core.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
# The fixed-nonce functions behind core/vectors/: reproducible test vectors only. Reusing a nonce under a key breaks
# both ciphers, so nothing else may reach them, and only the vector tests turn this on.
test-vectors = []

[dev-dependencies]
geunal-crypto = { workspace = true, features = ["test-vectors"] }
serde_json.workspace = true

[lints]
workspace = true

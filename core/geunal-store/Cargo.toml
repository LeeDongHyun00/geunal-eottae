[package]
name = "geunal-store"
description = "The device's SQLCipher database: migrations, the cross-process lock, Korean search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }
rustix.workspace = true
thiserror.workspace = true

# Android has no system OpenSSL for SQLCipher to link against, so build one in. Apple targets use CommonCrypto and
# Linux the system libcrypto (docs/parts/rust-core.md §7).
[target.'cfg(target_os = "android")'.dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

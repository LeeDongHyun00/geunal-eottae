[package]
name = "geunal-store"
description = "The device's SQLCipher database: migrations, the cross-process lock, Korean search"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# SQLCipher links Apple's CommonCrypto on iOS, the system libcrypto on Linux, and on Android the trimmed OpenSSL that
# core/scripts/build-openssl.sh builds for each ABI (docs/parts/rust-core.md §7).
[dependencies]
rusqlite = { workspace = true, features = ["bundled-sqlcipher"] }
rustix.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

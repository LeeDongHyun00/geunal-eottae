# cargo-deny policy for the Rust core; make lint-core runs it.

[graph]
# The mobile targets pull in crates of their own (JNI glue on Android), so the checks cover them too.
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # crypto-bigint 0.5 sits under P-256 and P-384, which mls-rs-crypto-rustcrypto 0.22 compiles in unconditionally. The
  # only cipher suite here, 0x0003 (protocol §2), runs on X25519 and Ed25519, so no secret goes through crypto-bigint.
  # The fix needs the next RustCrypto elliptic-curve release; drop this when mls-rs-crypto-rustcrypto moves to it.
  { id = "RUSTSEC-2026-0387", reason = "only P-256/P-384 use it, and suite 0x0003 uses neither" },
  # basic-toml enters only through uniffi-bindgen's template engine (askama_derive, a proc-macro) and never ships in
  # the app libraries. Revisit with the next uniffi upgrade.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, under uniffi-bindgen" },
]

[licenses]
version = 2
# Permissive licenses, plus MPL-2.0 (UniFFI), whose copyleft covers only changes to its own files. ISC covers ring and
# rustls-webpki; CDLA-Permissive-2.0 is the Mozilla root bundle in webpki-roots (docs/adr/0002-http-tls-stack.md).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[licenses.private]
# The workspace's own crates are unpublished and carry no license field.
ignore = true

[bans]
multiple-versions = "warn"
# A second copy of these would mean two MLS trait sets or two AEAD stacks in every app (docs/parts/rust-core.md §2).
deny = [
  { crate = "mls-rs-core", deny-multiple-versions = true },
  { crate = "chacha20poly1305", deny-multiple-versions = true },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

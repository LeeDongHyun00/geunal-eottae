# The request and response shapes of the API server at M0, plus the M1 contract: paths and operations whose summary
# starts with "M1:" answer 404 until the backend ships them. docs/parts/api-server.md §7 lists the endpoints and their
# rules, docs/parts/protocol.md §10 and §13–14 the M1 flows; this file is the byte-level contract the Rust core's sync
# engine and the e2e client build against.
#
# Conventions:
# - Field names are snake_case. Bytes (ciphertext, keys, MLS messages) are standard base64 with padding.
# - Every error body is {"error": "<code>", "message": "..."} (docs/parts/protocol.md §11). M1: 403 device_revoked
#   for a device revoked by a replacement also carries replaced_at (date-time), replaced_by (ios | android, the
#   account's active device) and replaced_via (provider | recovery), so the old device can say when, where and how
#   the account signed in (protocol §13).
# - M1 sign-in binding: the nonce handed to Kakao or Apple is lowercase hex SHA-256("geunal login v1" ‖ nonce ‖
#   signature_key), with nonce as its ASCII bytes and signature_key as the 32 raw bytes; the server recomputes it from
#   the request and compares it with the token's nonce claim (protocol §13).
# - Authentication: `Authorization: Bearer <access JWT>` on everything but /auth/*, /.well-known/jwks.json, /holidays
#   and /actuator/health. The JWT is ES256, 15 minutes, claims sub = user_id and did = device_id. A replacement
#   ticket (protocol §13) is the bearer for GET /me/recovery, GET /me/backups and GET /me/backups/latest only.
openapi: 3.1.0
info:
  title: geunal-eottae API
  version: 0.2.0-m1
servers:
  - url: http://127.0.0.1:8080
    description: infra/docker-compose.yml

paths:
  /auth/nonce:
    get:
      summary: One-time value a device signs to prove it holds the Ed25519 key it registers (valid 5 minutes)
      security: []
      responses:
        "200":
          content: { application/json: { schema: { type: object, required: [nonce], properties: { nonce: { type: string } } } } }

  /auth/stub:
    post:
      summary: Sign in without Kakao or Apple (only with GEUNAL_AUTH_STUB; otherwise 404) and register this device
      description: |
        `subject` stands for the identity a provider would assert; the same subject is the same account on every call.
        `signature` is Ed25519 over the ASCII bytes of `nonce` with the key whose public part is `signature_key`.
        M0 registered every call and revoked the account's previous device. M1: the same rules as /auth/kakao
        (protocol §13): 201 registers this device; when the account already has another active device the answer is 200
        `replace_required` with a ticket for /auth/replace, and nothing is registered yet.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [subject, display_name, platform, signature_key, nonce, signature]
              properties:
                subject: { type: string, maxLength: 200 }
                display_name: { type: string, maxLength: 40 }
                platform: { type: string, enum: [ios, android] }
                signature_key: { $ref: "#/components/schemas/Bytes", description: 32-byte Ed25519 public key }
                nonce: { type: string }
                signature: { $ref: "#/components/schemas/Bytes", description: 64-byte Ed25519 signature }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceRequired" } } } }
        "400": { description: "invalid_request (bad signature, unknown or reused nonce, bad field)" }

  /auth/kakao:
    post:
      summary: "M1: Sign in with Kakao and register this device (protocol §13)"
      description: |
        `id_token` is the Kakao OIDC ID token for our app key whose `nonce` claim is the sign-in binding of the
        request's `nonce` and `signature_key` (see the conventions above). 201 registers this device; 200 means another
        device is active, and a replacement ticket comes back instead.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeviceProof"
                - $ref: "#/components/schemas/NewAccount"
                - type: object
                  required: [id_token]
                  properties:
                    id_token: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceRequired" } } } }
        "400": { description: "invalid_request (bad proof, unknown or reused nonce, a new account without age_confirmed_at or display_name)" }
        "401": { description: provider_token_invalid }
        "429": { description: rate_limited }

  /auth/apple:
    post:
      summary: "M1: Sign in with Apple and register this device (protocol §13)"
      description: |
        `id_token` is the identity token for the iOS bundle ID or the Android services ID whose `nonce` claim is the
        sign-in binding of the request's `nonce` and `signature_key`. The server keeps no Apple token: account deletion
        brings a fresh authorization code (DELETE /me). 201 and 200 as for /auth/kakao.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeviceProof"
                - $ref: "#/components/schemas/NewAccount"
                - type: object
                  required: [id_token]
                  properties:
                    id_token: { type: string }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/ReplaceRequired" } } } }
        "400": { description: invalid_request }
        "401": { description: provider_token_invalid }
        "429": { description: rate_limited }

  /auth/apple/callback:
    post:
      summary: "M1: Android's Sign in with Apple web flow posts here (response_mode form_post)"
      description: |
        The server checks nothing here and answers 303 to https://<domain>/auth/apple with `id_token`, `state` and
        `user` in the fragment, each percent-encoded and length-limited. The app receives that App Link, checks
        `state`, and calls POST /auth/apple with `id_token`. `user` (JSON with the name) arrives on the first
        authorization only; the app may use it as `display_name`. The page at that address, opened when the app is not
        installed, is static and never reads or renders the fragment.
      security: []
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                code: { type: string }
                id_token: { type: string }
                state: { type: string }
                user: { type: string }
      responses:
        "303": { description: redirect to the App Links address carrying the fields in the fragment }

  /auth/guest:
    post:
      summary: "M1: Create a guest account and register this device"
      security: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeviceProof"
                - type: object
                  required: [age_confirmed_at, display_name]
                  properties:
                    age_confirmed_at: { type: string, format: date-time }
                    display_name: { type: string, minLength: 1, maxLength: 40 }
      responses:
        "201": { description: always a new account, content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "400": { description: invalid_request }
        "429": { description: rate_limited }

  /auth/recover:
    post:
      summary: "M1: A guest comes back on another device with the recovery code (protocol §10, §13)"
      description: |
        The server finds the account by `recovery_id` and checks `recovery_signature` with the stored recovery public
        key; the signed message is the ASCII bytes "geunal recover v1" followed by the ASCII bytes of `nonce`, the same
        nonce the device proof signs. On a match it registers this device at once and revokes the previous one: no
        ticket, the code is the proof. Accounts linked to Kakao or Apple cannot come back this way.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeviceProof"
                - type: object
                  required: [recovery_id, recovery_signature]
                  properties:
                    recovery_id: { $ref: "#/components/schemas/Bytes", description: 16 bytes }
                    recovery_signature: { $ref: "#/components/schemas/Bytes", description: 64-byte Ed25519 signature by the recovery signing key }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "400": { description: invalid_request }
        "401": { description: "recovery_invalid (no such account, a bad signature, or an account linked to Kakao or Apple)" }
        "429": { description: rate_limited }

  /auth/replace:
    post:
      summary: "M1: Finish a device replacement with the ticket of a replace_required sign-in"
      description: |
        `signature` is by the key the sign-in proved, over the ASCII bytes "geunal replace v1" followed by the ASCII
        bytes of `ticket`, so a leaked ticket alone gets no tokens. Registers that key, revokes the previous device (it
        gets `revoke`; the other members of its groups get `membership`) and returns tokens. The ticket is spent.
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [ticket, signature]
              properties:
                ticket: { type: string }
                signature: { $ref: "#/components/schemas/Bytes", description: 64-byte Ed25519 signature }
      responses:
        "201": { content: { application/json: { schema: { $ref: "#/components/schemas/Registered" } } } }
        "400": { description: "invalid_request (the signature does not verify with the ticket's key)" }
        "401": { description: "token_expired (unknown, spent or expired ticket)" }

  /auth/link:
    post:
      summary: "M1: Link the guest account to Kakao or Apple"
      description: |
        `nonce` comes from GET /auth/nonce and is bound into `id_token` as for sign-in, with the session device's
        registered key as `signature_key`. After linking, the account no longer comes back by recovery code alone; its
        recovery material and backups stay.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [provider, id_token, nonce]
              properties:
                provider: { type: string, enum: [kakao, apple] }
                id_token: { type: string }
                nonce: { type: string }
      responses:
        "200": { content: { application/json: { schema: { type: object, required: [providers], properties: { providers: { $ref: "#/components/schemas/Providers" } } } } } }
        "401": { description: provider_token_invalid }
        "409": { description: "account_exists (that Kakao or Apple account belongs to another account), already_linked" }

  /auth/refresh:
    post:
      summary: Trade a refresh token for new tokens; the old refresh token is spent
      description: "M1: a refresh token that was already spent ends every session of its device (reuse detection)."
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } }
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        "401": { description: "token_expired (unknown, spent or expired refresh token)" }
        "403": { description: device_revoked }

  /.well-known/jwks.json:
    get:
      summary: Public keys (JWK Set) that verify access tokens; the gateway reads this
      security: []
      responses:
        "200": { content: { application/json: { schema: { type: object } } } }

  /me:
    get:
      summary: The account, its current device and how many key packages it has left
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [user_id, display_name, device, key_packages]
                properties:
                  user_id: { $ref: "#/components/schemas/Uuid" }
                  display_name: { type: string }
                  device:
                    type: object
                    required: [id, platform, created_at]
                    properties:
                      id: { $ref: "#/components/schemas/Uuid" }
                      platform: { type: string, enum: [ios, android] }
                      created_at: { type: string, format: date-time }
                  key_packages: { type: integer }
                  providers: { $ref: "#/components/schemas/Providers", description: "M1: required from M1" }
                  recovery: { type: boolean, description: "M1, required from M1: the server holds recovery material" }
    delete:
      summary: "M1: Delete the account (protocol §13); only the active device may call this"
      description: |
        Deletes the account's identifying data, devices, sessions, key packages, recovery material, backups,
        memberships, state blobs, media and alpha stats in one transaction; objects go to object_deletions and the
        remaining members' devices get `membership`. Log entries the account wrote stay until their 30-day partition
        is dropped, so other members' devices keep one group state; the account row stays as a placeholder for their
        author_id. After the transaction the server unlinks Kakao (retried until it succeeds) and, for an account
        linked to Apple, exchanges `apple_authorization_code` and revokes the Apple tokens at once.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                apple_authorization_code: { type: string, description: "required for an account linked to Apple: from a Sign in with Apple made for this deletion" }
      responses:
        "204": { description: deleted; this device's tokens stop working }
        "400": { description: "invalid_request (an account linked to Apple without apple_authorization_code)" }
        "403": { description: replace_required (called with a replacement ticket) }

  /me/recovery:
    put:
      summary: "M1: Store the account's recovery material (protocol §10)"
      description: |
        The first upload needs no proof. When material is already stored, overwriting it needs `nonce` (GET
        /auth/nonce) and `proof`: the current recovery signing key's signature over the ASCII bytes
        "geunal recovery rotate v1" followed by the ASCII bytes of `nonce`, checked with the stored public key. The one
        exception is `new_key: true` from a device registered by a Kakao or Apple sign-in less than 30 minutes ago
        (starting over without the code); then the server also deletes every backup of the account in the same
        transaction, since nobody can open a backup sealed with the old AMK.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [amk_wrapped, recovery_id, recovery_public_key]
              properties:
                amk_wrapped: { $ref: "#/components/schemas/Bytes", description: "nonce ‖ ciphertext ‖ tag, 72 bytes" }
                recovery_id: { $ref: "#/components/schemas/Bytes", description: "16 bytes, unique" }
                recovery_public_key: { $ref: "#/components/schemas/Bytes", description: 32-byte Ed25519 public key of the recovery signing key }
                new_key: { type: boolean, default: false }
                nonce: { type: string, description: with proof }
                proof: { $ref: "#/components/schemas/Bytes", description: 64-byte Ed25519 signature by the current recovery signing key }
      responses:
        "204": { description: stored }
        "400": { description: invalid_request (a field of the wrong length) }
        "403": { description: "recovery_proof_required (material exists and the proof is missing or wrong, outside the new_key exception)" }
        "409": { description: recovery_conflict (another account uses this recovery_id) }
    get:
      summary: "M1: The recovery material a restoring device needs; also with a replacement ticket"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [amk_wrapped, updated_at]
                properties:
                  amk_wrapped: { $ref: "#/components/schemas/Bytes" }
                  updated_at: { type: string, format: date-time }
        "404": { description: not_found (none stored) }

  /me/backups:
    post:
      summary: "M1: Start a backup upload (protocol §10)"
      description: |
        Upload the sealed object with `PUT upload_url` and `Content-Length: size`, then call
        POST /me/backups/{id}/complete. The URL is signed with that Content-Length, so a larger object is refused at
        upload; completion checks the size again. An upload that is never completed is not listed and is deleted after
        a day.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [size]
              properties:
                size: { type: integer, format: int64, minimum: 1, maximum: 67108864, description: bytes of the sealed object (64 MiB at most) }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required: [id, upload_url, expires_in]
                properties:
                  id: { type: integer, format: int64 }
                  upload_url: { type: string, description: presigned PUT }
                  expires_in: { type: integer, description: seconds (900) }
        "409": { description: recovery_missing }
        "413": { description: too_large }
        "429": { description: rate_limited (10 a day) }
    get:
      summary: "M1: Completed backups, newest first, at most three; also with a replacement ticket"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [backups]
                properties:
                  backups: { type: array, items: { $ref: "#/components/schemas/Backup" } }

  /me/backups/{id}/complete:
    post:
      summary: "M1: The upload finished; the server checks the object's size and keeps the newest three backups"
      parameters: [{ name: id, in: path, required: true, schema: { type: integer, format: int64 } }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/Backup" } } } }
        "404": { description: not_found (no such upload of this account) }
        "409": { description: "upload_incomplete (no object, or not the declared size)" }

  /me/backups/latest:
    get:
      summary: "M1: Where to download the newest completed backup; also with a replacement ticket"
      responses:
        "200":
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Backup"
                  - type: object
                    required: [download_url, expires_in]
                    properties:
                      download_url: { type: string, description: presigned GET }
                      expires_in: { type: integer, description: seconds (900) }
        "404": { description: not_found (no completed backup) }

  /me/alpha-stats:
    post:
      summary: "M1: Alpha builds only: daily counts from an opted-in tester's device (protocol §14); 404 on public builds"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [stats]
              properties:
                stats:
                  type: array
                  minItems: 1
                  maxItems: 14
                  items:
                    type: object
                    required: [day, sessions, events, suggested, crashes]
                    properties:
                      day: { type: string, format: date, description: date in Asia/Seoul }
                      sessions: { type: integer, minimum: 0, description: times the app came to the foreground that day }
                      events: { type: integer, minimum: 0, description: "events created on this device that day (protocol §14 says what counts)" }
                      suggested: { type: integer, minimum: 0, description: "of those, created from a suggestion chip; at most events" }
                      crashes: { type: integer, minimum: 0, description: "abnormal exits that day, from MetricKit (iOS) or ApplicationExitInfo (Android)" }
      responses:
        "204": { description: stored; a day sent again overwrites the earlier counts }
        "400": { description: "invalid_request (suggested above events, a day more than 14 days old)" }
        "404": { description: not_found (public build) }

  /holidays:
    get:
      summary: "M1: Public holidays of whole years, at most two at a time (protocol §14)"
      description: |
        Requests are by whole years because a device replaces each year it receives, and replacing a year from part of
        it would drop the rest. `years` lists the requested years whose holidays the server knows completely, and
        `holidays` holds every holiday of those years and nothing else. A requested year missing from `years` (next
        year before it is announced) stays as the device has it. A request reads only the stored table; the daily job
        is the one caller of the 특일 정보 API, so this public endpoint cannot spend that key's daily quota. 60 an hour
        per IP.
      security: []
      parameters:
        - { name: from_year, in: query, required: true, schema: { type: integer, minimum: 2000 }, description: at most next year }
        - { name: to_year, in: query, required: true, schema: { type: integer }, description: "from_year or from_year + 1" }
      responses:
        "200":
          description: carries Cache-Control and ETag
          content:
            application/json:
              schema:
                type: object
                required: [years, holidays]
                properties:
                  years: { type: array, items: { type: integer }, description: the requested years whose holidays the server knows completely }
                  holidays:
                    type: array
                    items:
                      type: object
                      required: [day, name, substitute]
                      properties:
                        day: { type: string, format: date }
                        name: { type: string }
                        substitute: { type: boolean, description: 대체공휴일 }
        "304": { description: not modified (If-None-Match) }
        "400": { description: "invalid_request (to_year before from_year, more than two years, or from_year after next year)" }
        "429": { description: rate_limited }

  /me/push-token:
    put:
      summary: Set or clear (null) the current device's push token
      requestBody:
        content: { application/json: { schema: { type: object, properties: { token: { type: [string, "null"] } } } } }
      responses:
        "204": { description: stored }

  /me/key-packages:
    post:
      summary: Upload 1 to 100 MLS KeyPackages (each an MLSMessage with wire_format key_package, at most 1024 bytes); 200 kept per device
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [key_packages]
              properties: { key_packages: { type: array, items: { $ref: "#/components/schemas/Bytes" } } }
      responses:
        "200": { content: { application/json: { schema: { type: object, required: [count], properties: { count: { type: integer, description: packages now stored } } } } } }
        "413": { description: too_large }

  /users/{id}/devices:
    get:
      summary: The user's active devices with their Ed25519 signature keys (to check a KeyPackage before an Add)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    description: empty for an unknown user or one without an active device
                    items:
                      type: object
                      required: [id, platform, signature_key]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        platform: { type: string }
                        signature_key: { $ref: "#/components/schemas/Bytes" }

  /devices/{id}/key-packages/claim:
    post:
      summary: Take one unused KeyPackage of that device (oldest first); each is handed out once
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { content: { application/json: { schema: { type: object, required: [key_package], properties: { key_package: { $ref: "#/components/schemas/Bytes" } } } } } }
        "404": { description: "not_found (no such active device, or none left)" }

  /me/welcomes:
    get:
      summary: Welcomes addressed to this device; they are deleted as they are handed over
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [welcomes]
                properties:
                  welcomes:
                    type: array
                    items:
                      type: object
                      required: [group_id, seq, data]
                      properties:
                        group_id: { $ref: "#/components/schemas/Uuid" }
                        seq: { type: integer, format: int64, description: the Add commit that brought this device in; read the log from here }
                        data: { $ref: "#/components/schemas/Bytes", description: the MLS Welcome message }

  /me/groups:
    get:
      summary: Groups the account is pending or active in, with the cursor data to sync by
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [groups]
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      required: [id, kind, epoch, last_seq, role, status, joined_at]
                      properties:
                        id: { $ref: "#/components/schemas/Uuid" }
                        kind: { type: string, enum: [circle, dm] }
                        epoch: { type: integer, format: int64 }
                        last_seq: { type: integer, format: int64, description: the newest seq in the log; 0 when empty }
                        role: { type: string, enum: [owner, member] }
                        status: { type: string, enum: [pending, active] }
                        joined_at: { type: string, format: date-time }

  /groups:
    post:
      summary: Create a group; the caller is its owner. The 16 bytes of `id` are the MLS group ID. No body.
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required: [id, kind, epoch, last_seq]
                properties:
                  id: { $ref: "#/components/schemas/Uuid" }
                  kind: { type: string }
                  epoch: { type: integer, format: int64, const: 0 }
                  last_seq: { type: integer, format: int64, const: 0 }

  /groups/{id}/members:
    get:
      summary: Members with role and status (active members only may read)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [members]
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      required: [user_id, display_name, device_id, role, status, joined_at]
                      properties:
                        user_id: { $ref: "#/components/schemas/Uuid" }
                        display_name: { type: string }
                        device_id: { oneOf: [{ $ref: "#/components/schemas/Uuid" }, { type: "null" }], description: the member's active device }
                        role: { type: string, enum: [owner, member] }
                        status: { type: string, enum: [pending, active, removed] }
                        joined_at: { type: string, format: date-time }
        "403": { description: not_member }

  /groups/{id}/members/{userId}:
    delete:
      summary: Leave (own user_id) or, as owner, remove a member. Status becomes `removed` and every device involved gets `membership`; a remaining device then uploads the Remove commit. An owner who leaves is succeeded by the longest-standing active member.
      parameters: [{ $ref: "#/components/parameters/Id" }, { name: userId, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }]
      responses:
        "204": { description: removed }
        "403": { description: "not_member, not_owner" }
        "404": { description: not_found (not a current member) }

  /groups/{id}/commits:
    post:
      summary: Upload the one commit for `epoch`; the group moves to epoch + 1
      description: |
        `commit` is an MLSMessage PublicMessage whose group_id and epoch match the path and `epoch`, with content type
        commit. An external commit (sender type new_member_commit) is accepted from an active member's current device.
        `group_info` is the MLSMessage GroupInfo of epoch + 1. An Add commit lists the devices it adds in `added` and
        carries their `welcome` (one MLS Welcome, stored once per device); those users become `active`, their devices
        get a `welcome` event, and every other active device gets an `entry` event.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [epoch, commit, group_info]
              properties:
                epoch: { type: integer, format: int64, description: the epoch the commit was made in }
                commit: { $ref: "#/components/schemas/Bytes", description: at most 65536 bytes }
                group_info: { $ref: "#/components/schemas/Bytes", description: at most 65536 bytes }
                welcome: { $ref: "#/components/schemas/Bytes", description: required when `added` is not empty }
                added: { type: array, items: { $ref: "#/components/schemas/Uuid" }, description: device ids being added }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required: [seq, epoch, received_at]
                properties:
                  seq: { type: integer, format: int64, description: the commit's place in the log }
                  epoch: { type: integer, format: int64, description: the epoch the commit was made in (same as the request) }
                  received_at: { type: string, format: date-time, description: the server time stored with the entry (protocol §4) }
        "400": { description: "invalid_request (header mismatch, not a commit, welcome without added or the reverse)" }
        "403": { description: not_member }
        "404": { description: "not_found (group, or a device in `added`)" }
        "409": { description: epoch_conflict }
        "413": { description: too_large }

  /groups/{id}/messages:
    post:
      summary: Upload an application message for the current epoch
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [epoch, message, alert]
              properties:
                epoch: { type: integer, format: int64 }
                message: { $ref: "#/components/schemas/Bytes", description: "MLSMessage PrivateMessage for this group and epoch, at most 65536 bytes" }
                alert:
                  description: who to push to (protocol §8); "all", "none" or a list of user ids
                  oneOf: [{ type: string, enum: [all, none] }, { type: array, items: { $ref: "#/components/schemas/Uuid" } }]
                cat: { type: string, enum: [chat, plan], description: required unless alert is "none" }
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
                required: [seq, received_at]
                properties:
                  seq: { type: integer, format: int64 }
                  received_at: { type: string, format: date-time, description: the server time stored with the entry (protocol §4) }
        "403": { description: not_member }
        "409": { description: stale_epoch }

  /groups/{id}/log:
    get:
      summary: Log entries after a cursor, in seq order, at most 500
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: after, in: query, schema: { type: integer, format: int64, default: 0 }, description: last seq the device processed }
        - { name: limit, in: query, schema: { type: integer, default: 500, maximum: 500 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [entries, last_seq]
                properties:
                  last_seq: { type: integer, format: int64, description: the newest seq in the group; the device is caught up when entries end here }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [seq, epoch, kind, author_id, ciphertext, received_at]
                      properties:
                        seq: { type: integer, format: int64 }
                        epoch: { type: integer, format: int64 }
                        kind: { type: string, enum: [commit, app] }
                        author_id: { $ref: "#/components/schemas/Uuid" }
                        ciphertext: { $ref: "#/components/schemas/Bytes" }
                        received_at: { type: string, format: date-time, description: the server time every time rule uses (protocol §4) }
        "410": { description: cursor_expired (entries right after `after` were dropped with a 30-day partition) }

  /groups/{id}/group-info:
    get:
      summary: The latest GroupInfo, for an external commit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { content: { application/json: { schema: { $ref: "#/components/schemas/GroupInfo" } } } }
        "404": { description: not_found (none published yet) }
    put:
      summary: Publish the GroupInfo of the current epoch (needed once at epoch 0; commits carry later ones)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/GroupInfo" } } } }
      responses:
        "204": { description: stored }
        "409": { description: stale_epoch (the group is no longer in that epoch) }

  /groups/{id}/state/{kind}:
    put:
      summary: Overwrite a state blob (protocol §5)
      description: |
        `availability`, `member_profile`, `newcomer_bundle`: the caller's own slot; a write sealed for an older epoch than
        the stored blob is refused with 409 `stale_epoch`. `group_meta`: the group's one shared slot; send the `version`
        you read as `base_version` (0 when there was none) and get 409 `state_conflict` when someone wrote in between.
        `epoch` may not exceed the group's current epoch. Other active devices get a `state` event.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [availability, group_meta, member_profile, newcomer_bundle] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [epoch, ciphertext]
              properties:
                epoch: { type: integer, format: int64 }
                ciphertext: { $ref: "#/components/schemas/Bytes", description: "nonce ‖ ciphertext ‖ tag, at most 16384 bytes" }
                base_version: { type: integer, format: int64, description: group_meta only }
      responses:
        "200": { content: { application/json: { schema: { type: object, required: [version], properties: { version: { type: integer, format: int64 } } } } } }
        "409": { description: "state_conflict, stale_epoch" }
        "413": { description: too_large }

  /groups/{id}/state:
    get:
      summary: Every state blob of the group
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required: [states]
                properties:
                  states:
                    type: array
                    items:
                      type: object
                      required: [kind, owner_id, epoch, version, ciphertext, updated_at]
                      properties:
                        kind: { type: string }
                        owner_id: { $ref: "#/components/schemas/Uuid", description: "for group_meta, the member who sealed it last" }
                        epoch: { type: integer, format: int64 }
                        version: { type: integer, format: int64 }
                        ciphertext: { $ref: "#/components/schemas/Bytes" }
                        updated_at: { type: string, format: date-time }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/Uuid" } }
  schemas:
    Uuid: { type: string, format: uuid }
    Bytes: { type: string, contentEncoding: base64 }
    Tokens:
      type: object
      required: [user_id, device_id, access_token, expires_in, refresh_token]
      properties:
        user_id: { $ref: "#/components/schemas/Uuid" }
        device_id: { $ref: "#/components/schemas/Uuid" }
        access_token: { type: string, description: ES256 JWT }
        expires_in: { type: integer, description: access token lifetime in seconds (900) }
        refresh_token: { type: string, description: 30 days; replaced on every /auth/refresh }
    DeviceProof:
      description: The device registration every sign-in carries (protocol §13)
      type: object
      required: [platform, signature_key, nonce, signature]
      properties:
        platform: { type: string, enum: [ios, android] }
        signature_key: { $ref: "#/components/schemas/Bytes", description: 32-byte Ed25519 public key }
        nonce: { type: string, description: "from GET /auth/nonce, single use" }
        signature: { $ref: "#/components/schemas/Bytes", description: 64-byte Ed25519 signature over the ASCII bytes of nonce }
    NewAccount:
      description: Read only when the call creates the account, and then required; ignored for an existing account
      type: object
      properties:
        age_confirmed_at: { type: string, format: date-time, description: when the user ticked the 14-or-older box }
        display_name: { type: string, minLength: 1, maxLength: 40 }
    Registered:
      description: This device is now the account's active device (HTTP 201)
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [result, new_account, recovery]
          properties:
            result: { const: registered }
            new_account: { type: boolean, description: this call created the account }
            recovery: { type: boolean, description: the server holds recovery material for the account }
    ReplaceRequired:
      description: |
        Another device is active and nothing was registered (HTTP 200). The ticket is the bearer for GET /me/recovery,
        GET /me/backups and GET /me/backups/latest, and POST /auth/replace turns it into this device's registration.
      type: object
      required: [result, user_id, ticket, expires_in, active_device, recovery]
      properties:
        result: { const: replace_required }
        user_id: { $ref: "#/components/schemas/Uuid" }
        ticket: { type: string, description: "opaque random of at least 128 bits, not a JWT; the server stores only its SHA-256" }
        expires_in: { type: integer, description: seconds (1800) }
        active_device:
          type: object
          required: [platform, created_at]
          properties:
            platform: { type: string, enum: [ios, android] }
            created_at: { type: string, format: date-time }
        recovery: { type: boolean }
    Providers:
      type: array
      description: the sign-in providers linked to the account; empty for a guest
      items: { type: string, enum: [kakao, apple] }
    Backup:
      type: object
      required: [id, size, created_at]
      properties:
        id: { type: integer, format: int64 }
        size: { type: integer, format: int64, description: bytes of the sealed object }
        created_at: { type: string, format: date-time, description: when the upload was completed }
    GroupInfo:
      type: object
      required: [epoch, group_info]
      properties:
        epoch: { type: integer, format: int64, description: the epoch the GroupInfo describes }
        group_info: { $ref: "#/components/schemas/Bytes", description: MLSMessage GroupInfo whose group context matches the group and epoch }
security:
  - bearer: []

# Connection settings come from the environment (SPRING_DATASOURCE_*, SPRING_DATA_REDIS_*), as in
# infra/docker-compose.yml; nothing here points at a real server.
spring:
  application:
    name: api
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    formcontent:
      filter:
        # It reads a form PUT, PATCH or DELETE whole before BodyLimit could cap it, and no endpoint takes one.
        enabled: false
  jackson:
    # Every JSON field the protocol names is snake_case (user_id, group_id, base_version).
    property-naming-strategy: SNAKE_CASE

# Caddy, the one way in from outside (infra/alpha), sets X-Forwarded-For to the client's address; Tomcat takes it from
# a private-network peer only, so the access log records the device and not the proxy (api-server.md §10).
server:
  forward-headers-strategy: native
  tomcat:
    # Form posts are only Apple's web sign-in callback (an ID token and a code); BodyLimit caps every other body.
    max-http-form-post-size: 32KB

# JSON lines only. Request and response bodies, ciphertext and tokens never reach a log (api-server.md §10).
logging:
  structured:
    format:
      console: ecs
  # Below INFO these libraries write raw requests, bodies, handler arguments, SQL parameters or Redis payloads, which
  # hold tokens and ciphertext. Their levels are pinned so that turning the root level down to debug a problem never
  # does; LogHygieneTests runs the API at TRACE to keep it so.
  level:
    org.apache.coyote: info
    org.apache.tomcat: info
    org.springframework.web: info
    org.springframework.http: info
    org.springframework.jdbc: info
    org.springframework.data.redis: info
    org.springframework.security: info
    org.postgresql: info
    io.lettuce: info
    io.netty: info
    software.amazon.awssdk: info

management:
  endpoints:
    web:
      exposure:
        include: health

geunal:
  auth:
    # GEUNAL_AUTH_STUB: sign in with POST /auth/stub instead of Kakao or Apple. Local and CI only; AuthStubGuard
    # refuses to start a prod profile with it.
    stub: false
    access-ttl: 15m
    refresh-ttl: 30d
    nonce-ttl: 5m
    # How long a replace_required ticket stays good for POST /auth/replace and the restore reads (protocol §13).
    ticket-ttl: 30m
    # "새로 시작" (PUT /me/recovery with new_key) without a fresh provider proof: this long after a provider sign-in.
    provider-window: 30m
    jwt:
      # GEUNAL_AUTH_JWT_KEYS: a JWK Set with at least one P-256 private key; the first one signs, all are published at
      # /.well-known/jwks.json so a key can be rotated by adding the new one in front. Empty means a fresh key for this
      # process, which is fine locally (the gateway fetches the JWKS at runtime) and refused under the prod profile.
      keys: ""
    # Kakao Login (OpenID Connect). Sign-in is on only when both keys are set: GEUNAL_AUTH_KAKAO_APP_KEY is the native
    # app key, which Kakao puts in the ID token's aud; GEUNAL_AUTH_KAKAO_ADMIN_KEY unlinks a deleted account. Both are
    # secrets from the secret manager, never from this file.
    kakao:
      app-key: ""
      admin-key: ""
    # Sign in with Apple. Sign-in is on only when the four values below are set: the client secret is an ES256 JWT
    # made from GEUNAL_AUTH_APPLE_TEAM_ID, GEUNAL_AUTH_APPLE_KEY_ID and GEUNAL_AUTH_APPLE_PRIVATE_KEY (the .p8 file's
    # PEM text), and GEUNAL_AUTH_APPLE_REDIRECT_URI (https://<API host>/auth/apple/callback) is where Android's web
    # sign-in returns. The audiences are the iOS bundle ID and the services ID (infra.md §10).
    apple:
      team-id: ""
      key-id: ""
      private-key: ""
      redirect-uri: ""
      bundle-id: app.geunal.ios
      service-id: app.geunal.signin
      # GEUNAL_AUTH_APPLE_APP_LINK: where /auth/apple/callback sends Android's sign-in result. The relative default is
      # this server's own /auth/apple, the App Link path assetlinks.json covers.
      app-link: /auth/apple
  # /.well-known/assetlinks.json: the Android package and the SHA-256 of the Play app signing certificate in use
  # (infra.md §10). GEUNAL_APP_LINKS_ANDROID_FINGERPRINTS takes a comma-separated list.
  app-links:
    android-package: app.geunal
    android-fingerprints:
      - "DE:B8:C0:15:7E:58:20:68:36:81:A1:8D:74:0B:2D:17:6B:FC:AA:67:48:68:9E:5B:25:4B:2A:53:9C:52:1E:B8"
  # POST /me/alpha-stats (protocol §14). GEUNAL_ALPHA_STATS_ENABLED=true on the alpha server only; elsewhere 404.
  alpha-stats:
    enabled: false
  # GET /holidays and its daily sync from KASI's 특일 정보 API (protocol §14). GEUNAL_HOLIDAYS_SERVICE_KEY is the
  # 공공데이터포털 key in its "Decoding" form; without it the sync does nothing and the endpoint answers from the table.
  holidays:
    service-key: ""
  # APNs and FCM (protocol §8). GEUNAL_PUSH_APNS_KEY_ID and GEUNAL_PUSH_APNS_PRIVATE_KEY (.p8 PEM) and
  # GEUNAL_PUSH_FCM_SERVICE_ACCOUNT (the key file's JSON) come from the secret manager; GEUNAL_PUSH_APNS_TEAM_ID is
  # public. A platform without its keys sends nothing. APNs is production only: TestFlight builds hold production tokens.
  push:
    apns:
      key-id: ""
      private-key: ""
      team-id: ""
      topic: app.geunal.ios
    fcm:
      service-account: ""
  # How often sign-ins and refreshes move from access_log_outbox to the access-logs bucket.
  access-log:
    ship-every: PT5M
  # Object storage for backups (S3-compatible: NCP Object Storage, SeaweedFS locally). GEUNAL_S3_ENDPOINT is where the
  # API reaches the store; GEUNAL_S3_PUBLIC_ENDPOINT, if different, is the address devices reach, which presigned URLs
  # are signed for. GEUNAL_S3_ACCESS_KEY and GEUNAL_S3_SECRET_KEY come from the secret manager. GEUNAL_S3_BACKUPS_BUCKET
  # and GEUNAL_S3_ACCESS_LOGS_BUCKET are full bucket names (<prefix>-backups, <prefix>-access-logs). The prod profile
  # refuses to start without an endpoint.
  s3:
    endpoint: ""
    public-endpoint: ""
    region: kr-standard
    access-key: ""
    secret-key: ""
    backups-bucket: backups
    access-logs-bucket: access-logs

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ni: 1, focus: -1 };
  }
  renderVals() {
    const W = ['일', '월', '화', '수', '목', '금', '토'];
    const H0 = 8;
    const PX = 34;
    const GX = 40;
    const GW = 342;
    const focus = this.state.focus;
    // Column focus (m1.md decision 45): the tapped day widens in place and the other six keep a narrow strip each,
    // so the week stays on screen while that day's overlapping events get room for their titles.
    const FW = 196;
    const widths = W.map((_, i) => (focus < 0 ? GW / 7 : i === focus ? FW : (GW - FW) / 6));
    const xs = [];
    widths.reduce((x, w, i) => { xs[i] = x; return x + w; }, GX);

    const hours = [];
    for (let h = H0; h <= 22; h++) hours.push({ t: String(h), y: (h - H0) * PX });
    const pad2 = (n) => (n < 10 ? '0' : '') + n;
    const hm = (h) => pad2(Math.floor(h)) + ':' + (h % 1 ? '30' : '00');

    const soft = 'repeating-linear-gradient(135deg, #d3dfbb 0 4px, #e4ecd5 4px 8px)';
    // Tint for the card, strong color for ribbons and edges.
    const K = {
      school: ['#a0c0fa', '#1b1b1f', '#4172d1'],
      personal: ['#efb08a', '#1b1b1f', '#ba5a00'],
      device: ['#d5b9aa', '#1b1b1f', '#966b54'],
      cafe: ['#77d1c2', '#1b1b1f', '#008476'],
      family: ['#c04c7b', '#ffffff', '#c04c7b'],
      soft: [soft, '#1b1b1f', '#667e00'],
    };
    const E = [
      [0, 10, 11, '헬스', 'soft'], [0, 18, 20, '가족 · 저녁', 'family'],
      [1, 10, 14, '전공 수업', 'school'], [1, 10, 11, '교수 면담', 'personal'], [1, 19, 20, '헬스', 'soft'],
      [2, 13, 15, '교양 수업', 'school'],
      [3, 10, 12, '전공 수업', 'school'], [3, 19, 20, '헬스', 'soft'],
      [4, 13, 15, '교양 수업', 'school'], [4, 16, 18, '동아리 회의', 'personal'], [4, 16, 17, '팀플 회의', 'device'], [4, 17, 18, '과제', 'school'],
      [5, 17, 22, '카페 마감', 'cafe'],
      [6, 8, 13, '카페 오픈', 'cafe'],
    ].map(([d, s, e, t, k]) => ({ d, s, e, t, bg: K[k][0], fg: K[k][1], c: K[k][2] }));

    // Clusters: events of one day that overlap one another, transitively; touching ends do not overlap.
    // Order is the core's: by start, then the longer first.
    const days = W.map((_, d) => E.filter((e) => e.d === d).sort((a, b) => a.s - b.s || (b.e - b.s) - (a.e - a.s)));
    const clustersOf = (list) => {
      const out = [];
      list.forEach((e) => {
        const last = out[out.length - 1];
        if (last && e.s < last.end) { last.ev.push(e); last.end = Math.max(last.end, e.e); } else out.push({ ev: [e], start: e.s, end: e.e });
      });
      return out;
    };
    // Greedy lanes: an event goes to the first lane whose last event has ended.
    const lanesOf = (ev) => {
      const ends = [];
      return ev.map((e) => {
        let l = ends.findIndex((end) => end <= e.s);
        if (l < 0) { l = ends.length; ends.push(e.e); } else ends[l] = e.e;
        return l;
      });
    };
    const dayName = (d) => '10월 ' + (25 + d) + '일 ' + W[d] + '요일';
    const spoken = (e) => e.t + ', ' + hm(e.s) + '부터 ' + hm(e.e) + '까지';

    const cards = [];
    let focusCount = 0;
    days.forEach((list, d) => {
      const x0 = xs[d];
      const w = widths[d];
      const wide = focus === d;
      const narrow = focus >= 0 && !wide;
      clustersOf(list).forEach((cl) => {
        const y = (cl.start - H0) * PX + 1;
        const h = (cl.end - cl.start) * PX - 2;
        if (cl.ev.length === 1 || wide || narrow) {
          // One event, or a cluster laid out in lanes (the focused day, and bars in the narrow days).
          const lanes = lanesOf(cl.ev);
          const n = Math.max(...lanes) + 1;
          if (wide && cl.ev.length > 1) focusCount += cl.ev.length;
          cl.ev.forEach((e, i) => {
            const lw = (w - 3 - (n - 1) * 3) / n;
            const showText = !(narrow && cl.ev.length > 1);
            cards.push({
              x: (x0 + 1.5 + lanes[i] * (lw + 3)).toFixed(1), w: lw.toFixed(1),
              y: (e.s - H0) * PX + 1, h: (e.e - e.s) * PX - 2,
              bg: e.bg, fg: e.fg, t: showText ? e.t : '',
              time: wide ? hm(e.s) + '–' + hm(e.e) : (!narrow && e.e - e.s >= 2 ? hm(e.s) : ''),
              tf: wide ? 13 : narrow ? 10 : 11, lh: wide ? 16 : narrow ? 11 : 13,
              wm: narrow ? 'vertical-rl' : 'horizontal-tb', dir: 'column',
              pad: narrow ? '4px 2px' : wide ? '5px 7px' : '3px 4px',
              edge: wide ? 'inset 3px 0 0 ' + e.c : 'none',
              label: dayName(d) + ' ' + spoken(e),
              ribbons: [], hasMore: false,
            });
          });
          return;
        }
        // Week at rest: the longest event stays a card over the cluster's time, the rest become ribbons on its
        // right edge at their own times, and "+n" opens the column focus.
        const rep = cl.ev.reduce((a, b) => ((b.e - b.s) > (a.e - a.s) ? b : a));
        const others = cl.ev.filter((e) => e !== rep);
        const lanes = lanesOf(others);
        const n = Math.max(...lanes) + 1;
        const span = cl.end - cl.start;
        cards.push({
          x: (x0 + 1.5).toFixed(1), w: (w - 3).toFixed(1), y, h,
          // The time shows only when the card is tall enough to keep it clear of "+n"; the focus shows it in full.
          bg: rep.bg, fg: rep.fg, t: rep.t, time: span >= 3 ? hm(rep.s) : '',
          tf: 11, lh: 13, wm: 'horizontal-tb', dir: 'column',
          pad: '3px ' + (3 + n * 6) + 'px 3px 4px', edge: 'none',
          label: dayName(d) + ' ' + spoken(rep) + ', 겹치는 일정 ' + others.length + '개 더',
          ribbons: others.map((e, i) => ({
            c: e.c, right: 2 + lanes[i] * 6,
            top: (3 + (e.s - cl.start) / span * (h - 6)).toFixed(1),
            h: ((e.e - e.s) / span * (h - 6)).toFixed(1),
          })),
          hasMore: true, more: '+' + others.length,
          moreLabel: dayName(d) + ' ' + hm(cl.start) + '부터 ' + hm(cl.end) + '까지 겹치는 일정 ' + cl.ev.length + '개 펼치기',
          open: () => this.setState({ focus: d }),
        });
      });
    });

    const heads = W.map((w0, i) => {
      const today = i === 0;
      const narrow = focus >= 0 && focus !== i;
      return {
        plain: focus !== i, focus: focus === i,
        x: xs[i].toFixed(1), w: widths[i].toFixed(1), w0, n: String(25 + i),
        dow: w0 + '요일', badge: '겹침 ' + focusCount,
        wf: narrow ? 11 : 12, nf: narrow ? 13 : 14, c: narrow ? 22 : 26,
        fg: i === 0 ? '#c92f26' : i === 6 ? '#2958c8' : '#5c5c66',
        numFg: today ? '#ffffff' : (i === 0 ? '#c92f26' : i === 6 ? '#2958c8' : '#1b1b1f'),
        numBg: today ? '#1b1b1f' : 'transparent',
      };
    });
    const bd = { x: (xs[5] + 1).toFixed(1), w: (widths[5] - 2).toFixed(1), t: widths[5] > 40 ? '민수' : '' };

    const NEXT = [
      { t: '헬스', s: '오늘 10:00–11:00 · 끝남', kind: 'event', bg: soft, fg: '#1b1b1f', href: 'Editor.dc.html' },
      { t: '가족 · 저녁', s: '오늘 18:00–20:00 · 3시간 40분 뒤', kind: 'group', bg: '#c04c7b', fg: '#ffffff', href: 'Editor.dc.html' },
      { t: '전공 수업', s: '내일(월) 10:00–14:00', kind: 'event', bg: '#a0c0fa', fg: '#1b1b1f', href: 'Editor.dc.html' },
    ];
    const ni = Math.max(0, Math.min(NEXT.length - 1, this.state.ni));
    const cur = NEXT[ni];
    const nx = Object.assign({}, cur, {
      isGroup: cur.kind === 'group', isEvent: cur.kind === 'event', isBday: cur.kind === 'bday',
      ring: 'none',
    });
    return {
      heads, hours, cards, nx, bd,
      focused: focus >= 0,
      fp: { x: focus >= 0 ? xs[focus].toFixed(1) : 0, w: FW },
      unfocus: () => this.setState({ focus: -1 }),
      atStart: ni === 0, atEnd: ni === NEXT.length - 1,
      prevOp: ni === 0 ? 0.3 : 1, nextOp: ni === NEXT.length - 1 ? 0.3 : 1,
      prevNext: () => this.setState({ ni: Math.max(0, ni - 1) }),
      nextNext: () => this.setState({ ni: Math.min(NEXT.length - 1, ni + 1) }),
    };
  }
}
</script>

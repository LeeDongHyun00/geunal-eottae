</span>

<button type="button" aria-label="다음 할 일" onClick="{{nextNext}}" disabled="{{atEnd}}" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 22px; background: transparent; display: flex; align-items: center; justify-content: center; opacity: {{nextOp}}; cursor: pointer"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M9.5 6l6 6-6 6"></path></svg></button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // Index into the next-up list; 1 is the first item after now (Sunday 14:20).
    this.state = { ni: 1 };
  }
  renderVals() {
    // Calendar colors: step 2 tints with ink text; group appointments use step 5 with white text.
    const tint = { school: '#a0c0fa', cafe: '#77d1c2', personal: '#efb08a', device: '#d5b9aa' };
    const soft = 'repeating-linear-gradient(135deg, #d3dfbb 0 4px, #e4ecd5 4px 8px)';
    const ev = (t, kind) => {
      if (kind === 'soft') return { t, bg: soft, fg: '#1b1b1f' };
      if (kind === 'weekend') return { t, bg: '#7d63cb', fg: '#ffffff' };
      if (kind === 'family') return { t, bg: '#c04c7b', fg: '#ffffff' };
      return { t, bg: tint[kind], fg: '#1b1b1f' };
    };
    const E = {
      '9-28': [ev('전공 수업', 'school')],
      '9-29': [ev('교양 수업', 'school')],
      '9-30': [ev('전공 수업', 'school')],
      '10-1': [ev('교양 수업', 'school')],
      '10-6': [ev('교양 수업', 'school')],
      '10-7': [ev('전공 수업', 'school')],
      '10-8': [ev('교양 수업', 'school')],
      '10-10': [ev('카페 오픈', 'cafe')],
      '10-11': [ev('가족 · 외식', 'family')],
      '10-12': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-13': [ev('교양 수업', 'school')],
      '10-14': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-15': [ev('교양 수업', 'school'), ev('팀플 회의', 'device')],
      '10-16': [ev('카페 마감', 'cafe')],
      '10-17': [ev('카페 오픈', 'cafe'), ev('주말모임 · 보드게임', 'weekend')],
      '10-19': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-20': [ev('교양 수업', 'school')],
      '10-21': [ev('전공 시험', 'school')],
      '10-22': [ev('교양 수업', 'school'), ev('치과', 'personal')],
      '10-23': [ev('카페 마감', 'cafe')],
      '10-24': [ev('카페 오픈', 'cafe')],
      '10-25': [ev('헬스', 'soft'), ev('가족 · 저녁', 'family')],
      '10-26': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-27': [ev('교양 수업', 'school')],
      '10-28': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-29': [ev('교양 수업', 'school'), ev('팀플 회의', 'device')],
      '10-31': [ev('카페 오픈', 'cafe')],
    };
    const holidays = { '10-3': '개천절', '10-5': '대체휴일', '10-9': '한글날' };
    const bdays = { '10-30': '민수' };
    const dowName = ['일', '월', '화', '수', '목', '금', '토'];
    const days = [];
    for (let i = 0; i < 35; i++) {
      const inOct = i >= 4;
      const d = inOct ? i - 3 : 27 + i;
      const m = inOct ? 10 : 9;
      const key = m + '-' + d;
      const dow = i % 7;
      const holiday = holidays[key] || '';
      const today = key === '10-25';
      let fg = '#1b1b1f';
      if (!inOct) fg = '#696973';
      else if (holiday || dow === 0) fg = '#c92f26';
      else if (dow === 6) fg = '#2958c8';
      const events = E[key] || [];
      const bday = bdays[key] || '';
      const parts = [m + '월 ' + d + '일 ' + dowName[dow] + '요일'];
      if (today) parts.push('오늘');
      if (holiday) parts.push(holiday);
      if (bday) parts.push(bday + ' 생일');
      events.forEach((e) => parts.push(e.t));
      days.push({
        d: String(d),
        fg: today ? '#ffffff' : fg,
        bg: today ? '#1b1b1f' : 'transparent',
        fw: inOct ? 600 : 400,
        holiday,
        hasHoliday: !!holiday,
        bday,
        hasBday: !!bday,
        events,
        label: parts.join(', '),
      });
    }
    const weeks = [0, 1, 2, 3, 4].map((w) => ({ days: days.slice(w * 7, w * 7 + 7) }));

    // Next-up bar: the user's own items in time order; arrows step through them.
    const NEXT = [
      { t: '헬스', s: '오늘 10:00–11:00 · 끝남', kind: 'event', bg: soft, fg: '#1b1b1f', href: 'Editor.dc.html' },
      { t: '가족 · 저녁', s: '오늘 18:00–20:00 · 3시간 40분 뒤', kind: 'group', bg: '#c04c7b', fg: '#ffffff', href: 'Editor.dc.html' },
      { t: '전공 수업', s: '내일(월) 10:00–12:00', kind: 'event', bg: '#a0c0fa', fg: '#1b1b1f', href: 'Editor.dc.html' },
      { t: '교양 수업', s: '10월 27일(화) 13:00–15:00', kind: 'event', bg: '#a0c0fa', fg: '#1b1b1f', href: 'Editor.dc.html' },
      { t: '팀플 회의', s: '10월 29일(목) 16:00–17:00 · 기기 캘린더', kind: 'event', bg: '#d5b9aa', fg: '#1b1b1f', href: 'Editor.dc.html' },
      { t: '민수 생일', s: '10월 30일(금) · 종일', kind: 'bday', bg: '#ffffff', fg: '#1b1b1f', href: 'People.dc.html' },
      { t: '주말모임 · 날짜 잡기', s: '11월 7일(토) · 가안, 시간 투표 중', kind: 'group', bg: '#7d63cb', fg: '#ffffff', href: 'Appointment.dc.html' },
    ];
    const ni = Math.max(0, Math.min(NEXT.length - 1, this.state.ni));
    const cur = NEXT[ni];
    const nx = Object.assign({}, cur, {
      isGroup: cur.kind === 'group', isEvent: cur.kind === 'event', isBday: cur.kind === 'bday',
      ring: cur.kind === 'bday' ? 'inset 0 0 0 1px #e1e1e6' : 'none',
    });
    return {
      weeks, nx,
      atStart: ni === 0, atEnd: ni === NEXT.length - 1,
      prevOp: ni === 0 ? 0.3 : 1, nextOp: ni === NEXT.length - 1 ? 0.3 : 1,
      prevNext: () => this.setState({ ni: Math.max(0, ni - 1) }),
      nextNext: () => this.setState({ ni: Math.min(NEXT.length - 1, ni + 1) }),
    };
  }
}
</script>
</body>

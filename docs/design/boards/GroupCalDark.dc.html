<script type="text/x-dc" data-dc-script data-props='{"groupColor":{"editor":"enum","options":["토마토","귤","겨자","올리브","숲","민트","하늘","바다","포도","자두","벚꽃","코코아"],"default":"포도"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ni: 1 };
  }
  renderVals() {
    // Dark-mode ramps: step 1 sits just above the black canvas, step 5 is the same solid as in light mode.
    const RAMPS = {
      '토마토': ['#3e211e', '#5c2d28', '#7c3933', '#9e453e', '#c54e45'],
      '귤': ['#3c2314', '#593116', '#783e16', '#984c13', '#ba5a00'],
      '겨자': ['#35280d', '#4e3704', '#664900', '#7e5b00', '#976d00'],
      '올리브': ['#262e13', '#354112', '#45550c', '#556900', '#667e00'],
      '숲': ['#19301e', '#1b4526', '#1c5a2f', '#197037', '#00873d'],
      '민트': ['#09312c', '#00453d', '#005a50', '#006f63', '#008476'],
      '하늘': ['#0d2e3c', '#004257', '#005570', '#00698a', '#007ea4'],
      '바다': ['#1e2a40', '#273b61', '#314d83', '#3b60a6', '#4172d1'],
      '포도': ['#2b263f', '#3d355e', '#51457f', '#6655a2', '#7d63cb'],
      '자두': ['#362235', '#502f4f', '#6c3c6b', '#894a88', '#aa54a9'],
      '벚꽃': ['#3c202a', '#5a2c3d', '#793851', '#9a4465', '#c04c7b'],
      '코코아': ['#322822', '#49382e', '#61493b', '#7a5a48', '#966b54'],
    };
    const ramp = RAMPS[this.props.groupColor ?? '포도'] || RAMPS['포도'];
    const palette = ['#161618'].concat(ramp);
    const g = { s1: ramp[0], s2: ramp[1], s3: ramp[2], s4: ramp[3], s5: ramp[4] };
    const S = {
      '11-1': '555555555555544444555555', '11-2': '555555555411222222344455', '11-3': '555555555422211222344455',
      '11-4': '555555555422333333444455', '11-5': '555555555422211222333455', '11-6': '555555555422222233333355',
      '11-7': '555555554333334345555444', '11-8': '555555555544544444555555', '11-9': '555555555411222222344455',
      '11-10': '555555555422211222344455', '11-11': '555555555422333333444455', '11-12': '555555555422211222333455',
      '11-13': '555555555422222233333355', '11-14': '555555554333343334555555', '11-15': '555555555544544333555555',
      '11-16': '555555555411222222344455', '11-17': '555555555422211222344455', '11-18': '555555555422333333444455',
      '11-19': '555555555422211222333455', '11-20': '555555555422222233333355', '11-21': '555555554444344555222255',
      '11-22': '555555555554433444555555', '11-23': '555555555411222222344455', '11-24': '555555555422211222344455',
      '11-25': '555555555422333333444455', '11-26': '555555555422211222333455', '11-27': '555555555422222233333355',
      '11-28': '444444443333343333334444', '11-29': '444444444444433333444444', '11-30': '555555555411222222344455',
      '12-1': '555555555422211222344455', '12-2': '555555555422333333444455', '12-3': '555555555422211222333455',
      '12-4': '555555555422222233333355', '12-5': '555555554444444444555555',
    };
    const strip = (s) => {
      const stops = s.split('').map((ch, i) => palette[Number(ch)] + ' ' + ((i * 100) / 24).toFixed(3) + '% ' + (((i + 1) * 100) / 24).toFixed(3) + '%');
      // On black the six-hour ticks are cut in the canvas color instead of white.
      const ticks = 'repeating-linear-gradient(to right, transparent 0 calc(25% - 1px), rgba(0,0,0,0.95) calc(25% - 1px) 25%)';
      return ticks + ', linear-gradient(to right, ' + stops.join(', ') + ')';
    };
    const dowName = ['일', '월', '화', '수', '목', '금', '토'];
    const bdays = { '11-19': '서연' };
    const appts = { '11-21': '집들이' };
    const days = [];
    for (let i = 0; i < 35; i++) {
      const inNov = i < 30;
      const d = inNov ? i + 1 : i - 29;
      const m = inNov ? 11 : 12;
      const key = m + '-' + d;
      const dow = i % 7;
      const s = S[key];
      const best = Math.max.apply(null, s.slice(9, 21).split('').map(Number));
      let fg = inNov ? '#f4f4f6' : '#93939d';
      if (inNov && dow === 0) fg = '#ff6b61';
      else if (inNov && dow === 6) fg = '#7aa2ff';
      const bday = bdays[key] || '';
      const appt = appts[key] || '';
      const parts = [m + '월 ' + d + '일 ' + dowName[dow] + '요일', '9시부터 21시 사이 최대 ' + best + '명 비어 있음'];
      if (bday) parts.push(bday + ' 생일');
      if (appt) parts.push('약속 ' + appt);
      days.push({
        d: String(d), fg, fw: inNov ? 600 : 400, strip: strip(s), op: inNov ? 1 : 0.6,
        bday, hasBday: !!bday, appt, hasAppt: !!appt, label: parts.join(', '),
      });
    }
    const weeks = [0, 1, 2, 3, 4].map((w) => ({ days: days.slice(w * 7, w * 7 + 7) }));

    const soft = 'repeating-linear-gradient(135deg, #354112 0 4px, #262e13 4px 8px)';
    const NEXT = [
      { t: '헬스', s: '오늘 10:00–11:00 · 끝남', kind: 'event', bg: soft, fg: '#f4f4f6', href: 'Editor.dc.html' },

      { t: '전공 수업', s: '내일(월) 10:00–12:00', kind: 'event', bg: '#273b61', fg: '#f4f4f6', href: 'Editor.dc.html' },
      { t: '교양 수업', s: '10월 27일(화) 13:00–15:00', kind: 'event', bg: '#273b61', fg: '#f4f4f6', href: 'Editor.dc.html' },

    ];
    const ni = Math.max(0, Math.min(NEXT.length - 1, this.state.ni));
    const cur = NEXT[ni];
    const nx = Object.assign({}, cur, {
      isGroup: cur.kind === 'group', isEvent: cur.kind === 'event', isBday: cur.kind === 'bday',
      ring: 'none',
    });
    return {
      g, legend: ramp, weeks, nx,
      atStart: ni === 0, atEnd: ni === NEXT.length - 1,
      prevOp: ni === 0 ? 0.3 : 1, nextOp: ni === NEXT.length - 1 ? 0.3 : 1,
      prevNext: () => this.setState({ ni: Math.max(0, ni - 1) }),
      nextNext: () => this.setState({ ni: Math.min(NEXT.length - 1, ni + 1) }),
    };
  }

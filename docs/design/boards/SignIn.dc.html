<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>로그인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/6c25f752af04cd1acf08b3de90d860de) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
a{color:#1b1b1f;text-decoration:none}a:hover{color:#1b1b1f}
button{font:inherit;letter-spacing:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #1b1b1f; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word">

<div style="position: absolute; top: 54px; left: 8px; height: 44px; display: flex; align-items: center">
<a href="Welcome.dc.html" aria-label="뒤로" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M14.5 6l-6 6 6 6"></path></svg></a>
</div>

<div style="position: absolute; top: 118px; left: 24px; width: 342px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.03em">그날어때 시작하기</h1>
<p style="margin: 0; font-size: 17px; line-height: 1.55; color: #5c5c66">계정은 로그인과 멤버 목록에만 써요. 일정과 대화 내용은 운영자도 볼 수 없어요.</p>
</div>

<div style="position: absolute; left: 24px; bottom: 34px; width: 342px; display: flex; flex-direction: column; gap: 12px">
<label style="min-height: 56px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; background: #f4f4f6; display: flex; align-items: center; gap: 12px; cursor: pointer">
<input type="checkbox" checked="{{ageOk}}" onChange="{{toggleAge}}" style="width: 22px; height: 22px; margin: 0; accent-color: #1b1b1f">
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">만 14세 이상이에요</span><span style="font-size: 13px; color: #5c5c66">확인한 시각만 저장해요</span></span>
</label>

<sc-if value="{{ageOk}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<a href="Permissions.dc.html" style="height: 54px; border-radius: 999px; background: #fee500; color: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.3 0 .7.1 1 .1 5 0 9-3.1 9-7S17 4 12 4z" style="fill: #000000"></path></svg>카카오로 시작하기</a>
<a href="Permissions.dc.html" style="height: 54px; border-radius: 999px; background: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">Apple로 계속하기</a>
<a href="Permissions.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #5c5c66">게스트로 둘러보기</a>
</div>
</sc-if>
<sc-if value="{{notAge}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" disabled="{{true}}" style="height: 54px; border: none; border-radius: 999px; background: #fee500; color: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 600; opacity: 0.4"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 4C7 4 3 7.1 3 11c0 2.5 1.7 4.7 4.2 6l-1 3.6c-.1.3.3.6.6.4l4.2-2.8c.3 0 .7.1 1 .1 5 0 9-3.1 9-7S17 4 12 4z" style="fill: #000000"></path></svg>카카오로 시작하기</button>
<button type="button" disabled="{{true}}" style="height: 54px; border: none; border-radius: 999px; background: #000000; color: #ffffff; font-size: 17px; font-weight: 600; opacity: 0.4">Apple로 계속하기</button>
<button type="button" disabled="{{true}}" style="height: 48px; border: none; background: none; font-size: 15px; font-weight: 600; color: #5c5c66; opacity: 0.4">게스트로 둘러보기</button>
</div>
</sc-if>

<p style="margin: 4px 0 0; font-size: 13px; line-height: 1.55; color: #5c5c66; text-align: center">시작하면 <a href="#terms" style="text-decoration: underline; color: #3a3a40">이용약관</a>과 <a href="#privacy" style="text-decoration: underline; color: #3a3a40">개인정보 처리방침</a>에 동의하게 돼요.</p>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ageOk: false };
  }
  renderVals() {
    const ageOk = this.state.ageOk;
    return { ageOk, notAge: !ageOk, toggleAge: () => this.setState({ ageOk: !ageOk }) };
  }
}
</script>
</body>
</html>

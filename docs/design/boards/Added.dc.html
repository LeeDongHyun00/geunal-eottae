<span style="flex: none; width: 24px; height: 24px; border-radius: 12px; background: #1b1b1f; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" style="fill: none; stroke: #ffffff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>

</a>
<a href="ChatList.dc.html" aria-label="채팅, 읽지 않은 메시지 3개" style="position: relative; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #696973; font-size: 11px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 3.5c5 0 9 3.3 9 7.6s-4 7.6-9 7.6c-.9 0-1.8-.1-2.6-.3L5 20.5c-.5.2-1-.2-.9-.7l.7-3.2C3.7 15.2 3 13.3 3 11.1 3 6.8 7 3.5 12 3.5z" style="fill: currentColor"></path></svg>

<a href="Me.dc.html" style="border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #696973; font-size: 11px; font-weight: 600">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><circle cx="12" cy="8" r="4.2" style="fill: currentColor"></circle><path d="M4 20c0-4.2 3.6-7 8-7s8 2.8 8 7c0 .6-.4 1-1 1H5c-.6 0-1-.4-1-1z" style="fill: currentColor"></path></svg>
<span>나</span>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { card: true, changed: false };
  }
  renderVals() {
    const tint = { school: '#a0c0fa', cafe: '#77d1c2', personal: '#efb08a', device: '#d5b9aa' };
    const ev = (t, kind, fresh) => {
      // A just-added event carries a thin ink ring for a moment so the eye finds it.
      const ring = fresh ? 'inset 0 0 0 1.5px #1b1b1f' : 'none';
      if (kind === 'soft') return { t, bg: 'repeating-linear-gradient(135deg, #d3dfbb 0 4px, #e4ecd5 4px 8px)', fg: '#1b1b1f', ring };
      if (kind === 'weekend') return { t, bg: '#7d63cb', fg: '#ffffff', ring };
      if (kind === 'family') return { t, bg: '#c04c7b', fg: '#ffffff', ring };
      return { t, bg: tint[kind], fg: '#1b1b1f', ring };
    };
    const E = {
      '9-28': [ev('전공 수업', 'school')],
      '9-29': [ev('교양 수업', 'school')],
      '9-30': [ev('전공 수업', 'school')],
      '10-1': [ev('교양 수업', 'school')],
      '10-6': [ev('교양 수업', 'school')],
      '10-7': [ev('전공 수업', 'school')],
      '10-8': [ev('교양 수업', 'school')],
      '10-9': [ev('가족 · 나들이', 'family'), ev('카페 오픈', 'cafe')],
      '10-10': [ev('카페 오픈', 'cafe')],
      '10-11': [ev('가족 · 외식', 'family')],
      '10-12': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-13': [ev('교양 수업', 'school')],
      '10-14': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-15': [ev('교양 수업', 'school'), ev('팀플 회의', 'device')],
      '10-16': [ev('카페 마감', 'cafe')],
      '10-17': [ev('카페 오픈', 'cafe'), ev('주말모임 · 보드게임', 'weekend')],
      '10-19': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-20': [ev('교양 수업', 'school')],
      '10-21': [ev('전공 시험', 'school')],
      '10-22': [ev('교양 수업', 'school'), ev('치과', 'personal'), ev('팀플 회의', 'device'), ev('동아리 회의', 'personal')],
      '10-23': [ev('카페 마감', 'cafe')],
      '10-24': [ev('카페 오픈', 'cafe')],
      '10-25': [ev('헬스', 'soft'), ev('가족 · 저녁', 'family')],
      '10-26': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-27': [ev('교양 수업', 'school')],
      '10-28': [ev('전공 수업', 'school'), ev('헬스', 'soft')],
      '10-29': [ev('교양 수업', 'school'), ev('팀플 회의', 'device')],
      '10-30': [ev('카페 마감', 'cafe', true)],
      '10-31': [ev('카페 오픈', 'cafe')],
    };
    const holidays = { '10-3': '개천절', '10-5': '대체휴일', '10-9': '한글날' };
    const bdays = { '10-30': '민수' };
    const dowName = ['일', '월', '화', '수', '목', '금', '토'];
    const days = [];
    for (let i = 0; i < 35; i++) {
      const inOct = i >= 4;
      const d = inOct ? i - 3 : 27 + i;
      const m = inOct ? 10 : 9;
      const key = m + '-' + d;
      const dow = i % 7;
      const holiday = holidays[key] || '';
      const today = key === '10-25';
      const selected = key === '10-30';
      let fg = '#1b1b1f';
      if (!inOct) fg = '#696973';
      else if (holiday || dow === 0) fg = '#c92f26';
      else if (dow === 6) fg = '#2958c8';
      const events = E[key] || [];
      const bday = bdays[key] || '';
      // Three lines under the date; a holiday name takes one. Birthdays come first, and when the rest does not
      // fit the last line says how many are hidden (m1.md screen 4).
      const budget = 3 - (holiday ? 1 : 0) - (bday ? 1 : 0);
      const overflow = events.length > budget;
      const shown = overflow ? events.slice(0, budget - 1) : events;
      const hidden = events.length - shown.length;
      const parts = [m + '월 ' + d + '일 ' + dowName[dow] + '요일'];
      if (today) parts.push('오늘');
      if (holiday) parts.push(holiday);
      if (bday) parts.push(bday + ' 생일');
      events.forEach((e) => parts.push(e.t));
      days.push({
        d: String(d),
        fg: today ? '#ffffff' : fg,
        bg: today ? '#1b1b1f' : 'transparent',
        cellBg: selected ? '#f4f4f6' : 'transparent',
        fw: inOct ? 600 : 400,
        holiday,
        hasHoliday: !!holiday,
        bday,
        hasBday: !!bday,
        shown,
        hasMore: overflow,
        more: '+' + hidden,
        label: parts.join(', '),
      });
    }
    const weeks = [0, 1, 2, 3, 4].map((w) => ({ days: days.slice(w * 7, w * 7 + 7) }));
    const { card, changed } = this.state;
    return {
      weeks, card,
      toastText: changed ? '매주 금요일로 바꿨어요' : '카페 마감을 추가했어요',
      canUndo: !changed,
      dismiss: () => this.setState({ card: false }),
      apply: () => this.setState({ card: false, changed: true }),
    };
  }
}
</script>

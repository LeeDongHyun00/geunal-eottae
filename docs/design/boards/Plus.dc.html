<button type="button" role="radio" aria-checked="{{isYear}}" onClick="{{pickYear}}" style="flex: 1 1 0; min-height: 88px; box-sizing: border-box; padding: 12px 14px; border: none; border-radius: 16px; background: #ffffff; box-shadow: {{yearRing}}; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; cursor: pointer">

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { plan: 'year' };
  }
  renderVals() {
    const isYear = this.state.plan === 'year';
    const on = 'inset 0 0 0 2px #1b1b1f';
    const off = 'inset 0 0 0 1px #e1e1e6';
    return {
      isYear, isMonth: !isYear,
      yearRing: isYear ? on : off,
      monthRing: isYear ? off : on,
      cta: isYear ? '연 29,000원으로 시작하기' : '월 2,900원으로 시작하기',
      pickYear: () => this.setState({ plan: 'year' }),
      pickMonth: () => this.setState({ plan: 'month' }),
    };
  }
}
</script>

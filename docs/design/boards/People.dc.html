</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px">
<span style="height: 26px; padding: 0 10px; border-radius: 999px; background: #1b1b1f; color: #ffffff; display: flex; align-items: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{p.dday}}</span>

<span style="flex: 1 1 0; font-size: 17px">{{p.name}}</span>
<span style="font-size: 15px; color: #5c5c66">{{p.when}}</span>
</div>
</sc-for>
</section>

<div style="position: absolute; left: 16px; bottom: 34px; width: 358px; display: flex; flex-direction: column; gap: 10px">
<button type="button" style="height: 52px; border: none; border-radius: 999px; background: #ebebef; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 600; cursor: pointer"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round"><rect x="4.5" y="3.5" width="15" height="17" rx="2.5"></rect><circle cx="12" cy="10" r="2.75"></circle><path d="M7.5 17c.7-2 2.4-3 4.5-3s3.8 1 4.5 3"></path></svg>연락처에서 생일 가져오기</button>

</div>

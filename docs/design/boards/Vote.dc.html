<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>시간 투표</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face{font-family:"Pretendard";src:url(/_blob/6c25f752af04cd1acf08b3de90d860de) format("woff2");font-weight:45 920;font-style:normal;font-display:swap}
body{margin:0}
a{color:#1b1b1f;text-decoration:none}a:hover{color:#1b1b1f}
button{font:inherit;letter-spacing:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #ffffff; color: #1b1b1f; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; letter-spacing: -0.01em; word-break: keep-all; overflow-wrap: break-word">

<div style="position: absolute; top: 54px; left: 0; width: 390px; height: 44px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between">
<a href="Respond.dc.html" style="height: 44px; padding-right: 8px; display: flex; align-items: center; gap: 2px; font-size: 17px"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M14.5 6l-6 6 6 6"></path></svg>11월 7일</a>
<div role="group" aria-label="투표 종류" style="display: flex; padding: 2px; margin-right: 8px; border-radius: 999px; background: #ebebef">
<span aria-current="true" style="height: 40px; padding: 0 16px; border-radius: 999px; background: #ffffff; display: flex; align-items: center; font-size: 14px; font-weight: 600">시간</span>
<span style="height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: #5c5c66">활동</span>
</div>
</div>

<div style="position: absolute; top: 110px; left: 20px; width: 350px; display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em">몇 시에 볼까요?</h1>
<span style="font-size: 15px; color: #5c5c66">11월 7일 토요일 · 참가자 4명 중 {{voted}}명 투표</span>
</div>

<div style="position: absolute; top: 186px; left: 16px; width: 358px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.choose}}" aria-pressed="{{o.selected}}" style="position: relative; overflow: hidden; width: 358px; min-height: 66px; box-sizing: border-box; padding: 10px 14px 10px 16px; border: none; border-radius: 16px; background: #ffffff; box-shadow: {{o.ring}}; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: {{o.share}}; background: {{g.s1}}"></span>
<span style="position: relative; flex: 1 1 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums">{{o.t}}</span>
<span style="font-size: 13px; color: #5c5c66">{{o.cap}}</span>
</span>
<span style="position: relative; display: flex; align-items: center; gap: 8px">
<span style="display: flex">
<sc-for list="{{o.voters}}" as="v" hint-placeholder-count="1">
<span style="width: 26px; height: 26px; margin-left: -6px; border-radius: 13px; background: {{g.s2}}; box-shadow: 0 0 0 2px #ffffff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600">{{v}}</span>
</sc-for>
</span>
<span style="min-width: 28px; text-align: right; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums">{{o.n}}표</span>
</span>
</button>
</sc-for>
<button type="button" style="height: 52px; border: 1.5px dashed #b4b4bc; border-radius: 16px; background: #ffffff; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 600; color: #5c5c66; cursor: pointer"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 5v14M5 12h14"></path></svg>선택지 추가</button>
</div>

<div style="position: absolute; left: 16px; bottom: 34px; width: 358px; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{notPicked}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 0 4px">
<span style="font-size: 16px; font-weight: 600">누르면 바로 내 표가 들어가요</span>
<span style="font-size: 13px; line-height: 1.55; color: #5c5c66">마지막에 고른 것이 내 표예요. 모두 투표하거나 주도자가 닫으면 끝나고, 늦어도 11월 7일 00:00에 닫혀요.</span>
</div>
</sc-if>
<sc-if value="{{picked}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
<span style="font-size: 16px; font-weight: 600">4명 모두 투표해서 닫혔어요</span>
<span style="font-size: 14px; color: #5c5c66">{{winner}}로 정해졌어요</span>
</div>
<a href="Decided.dc.html" style="height: 52px; border-radius: 999px; background: {{g.s5}}; color: #ffffff; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 600">결과 보기</a>
</div>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"groupColor":{"editor":"enum","options":["토마토","귤","겨자","올리브","숲","민트","하늘","바다","포도","자두","벚꽃","코코아"],"default":"포도"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: null };
  }
  renderVals() {
    const RAMPS = {
      '토마토': ['#f9cdc8', '#f5aaa1', '#ed887d', '#de685d', '#c54e45'],
      '귤': ['#f5d1bc', '#efb08a', '#e5905a', '#d57128', '#ba5a00'],
      '겨자': ['#ead7b4', '#dcba7b', '#cd9d3d', '#b58400', '#976d00'],
      '올리브': ['#d3dfbb', '#b5c887', '#98b152', '#7d9911', '#667e00'],
      '숲': ['#c3e3c8', '#94cf9f', '#64b979', '#32a256', '#00873d'],
      '민트': ['#b6e5db', '#77d1c2', '#19bdaa', '#00a090', '#008476'],
      '하늘': ['#b8e0f3', '#7dcaec', '#36b3e2', '#0099c6', '#007ea4'],
      '바다': ['#c7dafb', '#a0c0fa', '#7ba6f5', '#5a8be9', '#4172d1'],
      '포도': ['#d9d4f8', '#c1b6f6', '#aa98f0', '#937ce3', '#7d63cb'],
      '자두': ['#ecceea', '#e1acde', '#d38cd1', '#c16dbf', '#aa54a9'],
      '벚꽃': ['#f6ccd9', '#f1a9c0', '#e786a9', '#d86691', '#c04c7b'],
      '코코아': ['#e5d5cd', '#d5b9aa', '#c29d89', '#ae836c', '#966b54'],
    };
    const ramp = RAMPS[this.props.groupColor ?? '포도'] || RAMPS['포도'];
    const g = { s1: ramp[0], s2: ramp[1], s3: ramp[2], s4: ramp[3], s5: ramp[4] };
    // Viewer is 서연, the last participant to vote. Order: the three suggestions, then added options, then 아무거나.
    const base = [
      { id: 'a', t: '17:00–19:00', cap: '추천 · 4명 모두 비어 있어요', voters: ['민'] },
      { id: 'b', t: '19:00–21:00', cap: '추천 · 4명 모두 비어 있어요', voters: ['하', '지'] },
      { id: 'c', t: '09:00–11:00', cap: '추천 · 2명 비어 있어요', voters: [] },
      { id: 'd', t: '14:00–16:00', cap: '지영이 추가 · 2명 비어 있어요', voters: [] },
      { id: 'e', t: '아무거나', cap: '어느 시간이든 좋아요', voters: [], any: true },
    ];
    const pick = this.state.pick;
    const opts = base.map((o) => {
      const voters = pick === o.id ? o.voters.concat(['서']) : o.voters;
      const selected = pick === o.id;
      return {
        t: o.t, cap: o.cap, voters, any: !!o.any, n: String(voters.length),
        share: (voters.length * 25) + '%',
        selected,
        ring: selected ? 'inset 0 0 0 2px ' + g.s5 : 'inset 0 0 0 1px #e1e1e6',
        choose: () => this.setState({ pick: o.id }),
      };
    });
    // Most votes wins; 아무거나 never adds to a choice; ties go to the earlier option; no real votes -> suggestion 1.
    let winner = opts[0];
    let best = 0;
    opts.forEach((o) => {
      if (o.any) return;
      if (o.voters.length > best) { best = o.voters.length; winner = o; }
    });
    const voted = pick ? 4 : 3;
    return { g, opts, voted: String(voted), picked: !!pick, notPicked: !pick, winner: winner.t };
  }
}
</script>
</body>
</html>

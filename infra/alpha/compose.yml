# infra/alpha/compose.yml: the alpha server (docs/parts/infra.md §2), one Micro VM with 1 GB of memory. The API,
# the realtime gateway, PostgreSQL and Valkey run here. deploy.sh copies this directory to /opt/geunal and writes the
# images' tags, the host names and the Caddyfile's hash into /opt/geunal/.env. The secrets are root-only files under
# /etc/geunal that bootstrap.sh creates on the server, so none of them is in the repository.
name: geunal

# The compose network's range. It is fixed so that the gateway can trust the X-Forwarded-For that Caddy sends from it
# (TRUSTED_PROXIES); nothing outside this network reaches the gateway. Docker cannot change the range of an existing
# network, so deploy.sh takes the stack down once when the range differs, and keeps the volumes.
x-subnet: &subnet 172.30.0.0/24

networks:
  default:
    ipam:
      config:
        - subnet: *subnet

services:
  postgres:
    image: postgres:16.15
    # Memory is what a Micro runs out of first (infra.md §2): 128 MB of shared buffers, and few connections because one
    # API with a small pool is the only client.
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30"]
    env_file: /etc/geunal/postgres.env
    environment:
      POSTGRES_DB: geunal
      POSTGRES_USER: geunal
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geunal -d geunal"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # Valkey rather than Redis, whose licence changed after 7.4. The API keeps only pub/sub signals and rate limits here
  # (infra.md §2), so nothing is persisted and the oldest keys give way when the cap is reached.
  valkey:
    image: valkey/valkey:8.1.11-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  # deploy.sh loads this image over SSH; there is no registry yet.
  api:
    image: geunal/api:${GEUNAL_API_TAG:?deploy.sh writes GEUNAL_API_TAG into /opt/geunal/.env}
    pull_policy: never
    read_only: true
    tmpfs: [/tmp]
    # api.env holds what bootstrap.sh makes on the server; api.secrets.env, from Secret Manager (fetch-secrets.py),
    # comes second so its keys win, and may not exist yet.
    env_file:
      - path: /etc/geunal/api.env
      - path: /etc/geunal/api.secrets.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/geunal
      SPRING_DATASOURCE_USERNAME: geunal
      SPRING_DATA_REDIS_HOST: valkey
      # NCP Object Storage for backups; the keys are in api.env. Devices reach the same public endpoint, so presigned
      # URLs need no separate address.
      GEUNAL_S3_ENDPOINT: https://kr.object.ncloudstorage.com
      GEUNAL_S3_BACKUPS_BUCKET: geunal-alpha-backups
      # Access logs (api-server.md §10) go to their own bucket, which keeps them 92 days (bucket-lifecycle.sh).
      GEUNAL_S3_ACCESS_LOGS_BUCKET: geunal-alpha-access-logs
      # The alpha statistics endpoint exists only here; release servers answer 404 (api-server.md, #102).
      GEUNAL_ALPHA_STATS_ENABLED: "true"
      # Apple sign-in's public half; the key ID and .p8 key are in api.env. Apple stays off until all four are set.
      GEUNAL_AUTH_APPLE_TEAM_ID: BT6XQAVMKW
      GEUNAL_AUTH_APPLE_REDIRECT_URI: https://${GEUNAL_API_HOST:-api.geunaleottae.com}/auth/apple/callback
      # Health turns DOWN below 1 GB free on the 10 GB disk, which the outside watch (watch.sh) reports before the
      # database or Docker run out of room.
      MANAGEMENT_HEALTH_DISKSPACE_THRESHOLD: 1GB
      # The 256 MB heap of infra.md §2; -Xmx wins over the image's MaxRAMPercentage.
      JAVA_TOOL_OPTIONS: -Xmx256m
    # Loopback only: the internet reaches the API through Caddy, and the operator through SSH.
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  # The realtime gateway (docs/parts/gateway.md): it tells a device that something in its groups changed, so another
  # member's edit shows within a second instead of at the next refresh. Only Caddy reaches it, so it starts with
  # Caddy in the https profile. deploy.sh loads this image over SSH, like the API's.
  gateway:
    image: geunal/gateway:${GEUNAL_GATEWAY_TAG:-none}
    profiles: [https]
    pull_policy: never
    read_only: true
    tmpfs: [/tmp]
    environment:
      REDIS_URL: redis://valkey:6379
      JWKS_URL: http://api:8080/.well-known/jwks.json
      # Caddy's X-Forwarded-For names the device, so the per-client connection limit counts devices, not Caddy.
      TRUSTED_PROXIES: *subnet
      # Idle schedulers sleep instead of spinning, which leaves the one vCPU to the API and PostgreSQL.
      ERL_AFLAGS: +sbwt none +sbwtdcpu none +sbwtdio none
    # About 55 MB idle and 115 MB with 1,000 devices. With no swap allowed, a gateway past the cap is killed and
    # restarted at once instead of pushing the API and PostgreSQL into swap; its devices reconnect and catch up through
    # the API (protocol §7).
    mem_limit: 160m
    memswap_limit: 160m
    # If the whole VM runs out of memory, the kernel picks the gateway before PostgreSQL and the API.
    oom_score_adj: 500
    depends_on:
      api: { condition: service_healthy }
      valkey: { condition: service_healthy }
    restart: unless-stopped

  # TLS for the API and the gateway once they have host names (GEUNAL_API_HOST, GEUNAL_RT_HOST): deploy.sh starts
  # this with --profile https only then. Certificates stay in the caddy-data volume, so a restart does not ask Let's
  # Encrypt again.
  caddy:
    image: caddy:2.11.7
    profiles: [https]
    # The Caddyfile's hash, which deploy.sh writes: a new Caddyfile changes the label, so `up` recreates the container
    # and Caddy reads the file again.
    labels:
      geunal.caddyfile: ${GEUNAL_CADDYFILE:-}
    environment:
      GEUNAL_API_HOST: ${GEUNAL_API_HOST:-}
      GEUNAL_RT_HOST: ${GEUNAL_RT_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres:
  caddy-data:
  caddy-config:

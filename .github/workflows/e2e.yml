# Headless end-to-end tests: the local stack from infra/docker-compose.yml, with the api and gateway images built from
# this commit, and the Rust tests in core/geunal-e2e against it. Called from ci.yml.
name: e2e

on:
  workflow_call:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The API image packages a boot jar that Gradle builds outside it.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: e2e
      # The M0 gate test skips itself when the API runs without the auth stub; CI runs the stack with it, so a skip
      # here would hide a broken gate.
      - run: make e2e
        env:
          GEUNAL_E2E_REQUIRE: "1"
      - name: Show the stack on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.yml ps --all
          docker compose -f infra/docker-compose.yml logs --no-color --tail 200

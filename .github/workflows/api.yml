# API server: ktlint and the tests against PostgreSQL and Redis in Testcontainers, then the container image and its
# Trivy scan. Called from ci.yml.
name: api

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      # Also checks the wrapper jar against Gradle's published checksums. The basic cache provider is a thin layer over
      # actions/cache; the default one is a proprietary service.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - run: make lint-api test-api
      - run: make scan-api

# Android release: builds the app bundle from main, signs it with the upload key and sends it to Play's internal
# testing track (docs/parts/infra.md §5 and §10, infra/release/README.md). It only runs by hand, and the
# `play-internal` environment holds the secrets behind the user's approval, so neither a pull request nor a fork ever
# sees them (docs/qa.md §5.2 rule 9). The build itself is the app's `make release-android`.
name: release-android

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Send the bundle to the internal track. Off for the very first bundle, which Play only takes by hand.
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-android
  cancel-in-progress: false

jobs:
  internal:
    name: internal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: play-internal
    env:
      GEUNAL_API_BASE: https://api.geunaleottae.com
      GEUNAL_APP_LINK_HOST: api.geunaleottae.com
      GEUNAL_APPLE_SERVICE_ID: app.geunal.signin
      GEUNAL_PLAY_UPLOAD: ${{ inputs.upload }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
          key: android-release
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool.sh', 'core/scripts/build-openssl.sh') }}
      - run: make build-android
      # Minutes since 2026-01-01 UTC, the same rule as release-ios.yml: always larger than any earlier upload.
      - name: Number the build
        run: echo "GEUNAL_BUILD_NUMBER=$(( ($(date -u +%s) - 1767225600) / 60 ))" >>"$GITHUB_ENV"
      # The keystore and the service account leave the secret store only as files the job's user alone can read.
      - name: Write the upload key and the service account
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode >"$RUNNER_TEMP/upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" >"$RUNNER_TEMP/play.json"
          {
            echo "GEUNAL_UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks"
            echo "GEUNAL_PLAY_SERVICE_ACCOUNT=$RUNNER_TEMP/play.json"
          } >>"$GITHUB_ENV"
      - run: make release-android
        env:
          GEUNAL_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          GEUNAL_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          GEUNAL_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GEUNAL_KAKAO_APP_KEY: ${{ secrets.KAKAO_APP_KEY }}
      - name: Remove the key files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/play.json"
      # The signed bundle is what Play would serve anyway, so it is not secret; the first one is uploaded by hand from
      # here, and later ones stay a few days for checking what went up.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-${{ env.GEUNAL_BUILD_NUMBER }}
          path: apps/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Say which build was made
        run: |
          where=$([ "$GEUNAL_PLAY_UPLOAD" = true ] && echo "sent to the internal track" || echo "kept as an artifact")
          echo "Build $GEUNAL_BUILD_NUMBER of $(git rev-parse --short=12 HEAD), $where" >>"$GITHUB_STEP_SUMMARY"

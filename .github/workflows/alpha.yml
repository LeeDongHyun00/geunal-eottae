# The alpha server's third-party images (infra/alpha/compose.yml: PostgreSQL, Valkey, Caddy): Trivy, as the weekly
# audit runs it, so a pull request that moves one of them, Dependabot's included, shows its findings before it merges.
# The API image is api.yml's. Called from ci.yml.
name: alpha

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool.sh') }}
      - run: make scan-alpha

# Grouped weekly updates. Each part adds its ecosystem (cargo, gradle, mix, docker) here in its own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The core stays on the versions kickoff appendix B verified together. For 0.x crates a minor release is a breaking
  # one, so only patch releases come in here; anything bigger is its own PR (CLAUDE.md, version pinning).
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

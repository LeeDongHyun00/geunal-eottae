# Grouped weekly updates. Each part adds its ecosystem (cargo, gradle, mix, docker) here in its own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # The core stays on the versions kickoff appendix B verified together. For 0.x crates a minor release is a breaking
  # one, so only patch releases come in here; anything bigger is its own PR (CLAUDE.md, version pinning).
  - package-ecosystem: cargo
    directory: /core
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Spring Boot's BOM sets most library versions, so this mostly moves Boot and the build plugins. Kotlin stays on the
  # release line Boot is built with, and the Gradle wrapper on the line that Kotlin's Gradle plugin supports; moving
  # either is its own PR.
  - package-ecosystem: gradle
    directory: /server/api
    schedule:
      interval: weekly
    ignore:
      # Dependabot names a plugin applied as `kotlin("jvm")` by the bare argument, so the Kotlin plugins appear as `jvm`
      # and `plugin.spring`; the prefix covers Kotlin libraries and plugins applied by full id.
      - dependency-name: jvm
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: plugin.spring
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: org.springframework.boot*
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # Versions live in apps/android/gradle/libs.versions.toml. AGP minors move with the Kotlin compatibility table and
  # Kotlin minors with AGP's (see the comments there), the Gradle wrapper with Kotlin's supported range, and the Compose
  # BOM pulls every Compose library along; each of those is its own PR.
  - package-ecosystem: gradle
    directory: /apps/android
    schedule:
      interval: weekly
    ignore:
      - dependency-name: com.android.application
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: com.android.library
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "com.android.tools.build*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: gradle-wrapper
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: androidx.compose:compose-bom
        update-types: ["version-update:semver-major"]
    groups:
      gradle:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The image's Java follows the toolchain in build.gradle.kts, so a new Java release is its own PR.
  - package-ecosystem: docker
    directory: /server/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: mix
    directory: /server/gateway
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      mix:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope

  # The builder's Elixir and OTP follow .tool-versions (make lint-gateway checks), so they move by hand with it.
  - package-ecosystem: docker
    directory: /server/gateway
    schedule:
      interval: weekly
    ignore:
      - dependency-name: hexpm/elixir
    commit-message:
      prefix: build
      include: scope

  # The exact provider pin and the lock file are in each root; modules only set a floor. Terraform itself moves by hand
  # in scripts/tool.sh and versions.tf together. After a bump, make lock-terraform restores the macOS checksums.
  - package-ecosystem: terraform
    directories: ["/infra/terraform/envs/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

  # PostgreSQL and Redis majors are decisions about the servers too, so they move by hand. The api and gateway images
  # are built locally (make up).
  - package-ecosystem: docker-compose
    directory: /infra
    schedule:
      interval: weekly
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: redis
        update-types: ["version-update:semver-major"]
      - dependency-name: "geunal/*"
    commit-message:
      prefix: build
      include: scope
